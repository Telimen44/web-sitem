<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Görsel Algı Dünyası</title>
    <meta name="description"
        content="Çocuklar için eğlenceli görsel algı oyunu - Gölge eşleştirme, farklı olanı bulma ve örüntü tamamlama">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Vercel Web Analytics -->
    <script src="/analytics.js"></script>
</head>

<body>
    <div id="game-container">
        <!-- Ana Menü -->
        <div id="main-menu" class="screen active">
            <h1 class="title">Görsel Algı<br>Dünyası</h1>
            <button id="start-btn" class="btn-primary">🚀 MACERAYA BAŞLA</button>
            <div class="floating-shapes">
                <div class="shape circle"></div>
                <div class="shape square"></div>
                <div class="shape triangle"></div>
            </div>
        </div>

        <!-- Bölüm 1: Gölge Ormanı -->
        <div id="level-1" class="screen level">
            <div class="level-header">
                <h2>🌳 Gölge Ormanı</h2>
                <p>Renkli objeye tıkla, sonra gölgesine tıkla!</p>
            </div>
            <div class="game-area">
                <div class="shadows-container">
                    <!-- Gölgeler buraya gelecek -->
                </div>
                <div class="animals-container">
                    <!-- Objeler buraya gelecek -->
                </div>
            </div>
        </div>

        <!-- Bölüm 2: Farklı Olanı Bul -->
        <div id="level-2" class="screen level">
            <div class="level-header">
                <h2>🔍 Farklı Olanı Bul</h2>
                <p>Diğerlerinden farklı olanı bul!</p>
            </div>
            <div class="game-area centered">
                <div class="fish-grid">
                    <!-- Öğeler buraya gelecek -->
                </div>
            </div>
        </div>

        <!-- Bölüm 3: Örüntü Treni -->
        <div id="level-3" class="screen level">
            <div class="level-header">
                <h2>🚂 Örüntü Treni</h2>
                <p>Sıradaki şekil hangisi?</p>
            </div>
            <div class="game-area column">
                <div class="pattern-row">
                    <!-- Örüntü dizisi -->
                </div>
                <div class="options-row">
                    <!-- Seçenekler -->
                </div>
            </div>
        </div>

        <!-- Zafer Ekranı -->
        <div id="victory-screen" class="screen">
            <h1>🎉 Tebrikler! 🎉</h1>
            <p>Tüm bölümleri tamamladın!</p>
            <div class="stars">⭐⭐⭐</div>
            <button id="restart-btn" class="btn-primary">🔄 Tekrar Oyna</button>
        </div>
    </div>

    <script src="script.js"></script>
<script>
(function(){
  document.addEventListener("contextmenu", function(e){ e.preventDefault(); }, { capture: true });
})();
</script>
</body>

</html>
