<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayıları Karşılaştır - Özel Eğitim</title>
    <script src="https://cdn.tailwindcss.com" onerror="document.documentElement.classList.add('fallback-ui')"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }

        .number-card {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            border: 0;
            padding: 0;
            text-align: center;
        }

        .number-card:focus-visible,
        #equal-buttons button:focus-visible,
        #menu-screen button:focus-visible,
        #difficulty-screen button:focus-visible,
        #result-screen button:focus-visible,
        #header-area button:focus-visible {
            outline: 6px solid #f59e0b;
            outline-offset: 8px;
        }

        .fallback-confetti-piece {
            position: fixed;
            width: 12px;
            height: 18px;
            border-radius: 999px;
            pointer-events: none;
            opacity: 0.95;
            animation: confetti-fall 0.9s ease-out forwards;
            z-index: 120;
        }

        @keyframes confetti-fall {
            0% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); opacity: 0.95; }
            100% { transform: translate3d(var(--dx), var(--dy), 0) rotate(var(--rot)) scale(0.7); opacity: 0; }
        }
        
        .bounce-short { animation: bounce-short 0.5s ease-in-out; }
        @keyframes bounce-short { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        
        .shake-hard { animation: shake-hard 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake-hard {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-15px) rotate(-3deg); }
            40%, 80% { transform: translateX(15px) rotate(3deg); }
        }

        .pop-in { animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pop-in { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .card-correct { 
            border-color: #22c55e !important; 
            background-color: #dcfce7 !important; 
            color: #15803d !important;
            transform: scale(1.1) !important;
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.6) !important;
            z-index: 20;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card-wrong { 
            border-color: #ef4444 !important; 
            background-color: #fee2e2 !important; 
            color: #b91c1c !important;
            box-shadow: inset 0 0 25px rgba(239, 68, 68, 0.3) !important;
        }

        .card-dimmed {
            opacity: 0.4 !important;
            transform: scale(0.9) !important;
            filter: grayscale(80%);
            transition: all 0.4s ease;
        }

        .card-hint {
            border-color: #f59e0b !important;
            background-color: #fef3c7 !important;
            color: #b45309 !important;
            box-shadow: 0 0 0 10px rgba(250, 204, 21, 0.22), 0 0 45px rgba(245, 158, 11, 0.45) !important;
            transform: scale(1.05) !important;
        }

        .streak-pop { animation: streak-pop 0.55s ease-out; }
        @keyframes streak-pop {
            0% { transform: scale(0.85); opacity: 0.3; }
            60% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        body.smartboard-mode .bg-white {
            max-width: min(100%, 1320px);
            padding: 2.8rem;
        }

        body.smartboard-mode #question-text {
            font-size: clamp(3.3rem, 5.4vw, 5.7rem) !important;
        }

        body.smartboard-mode #num-box-1,
        body.smartboard-mode #num-box-2 {
            min-height: 23rem;
            font-size: clamp(7rem, 12vw, 12rem) !important;
        }

        body.smartboard-mode #equal-buttons button {
            min-height: 13rem;
            font-size: clamp(2.4rem, 4vw, 3.6rem) !important;
        }

        #header-area > div:first-child > button[onclick="selectMode('karisik')"] {
            display: none !important;
        }

        #game-screen > div:first-child > button {
            min-width: 180px;
            padding: 0.85rem 1.4rem;
            border-radius: 999px;
            background: #e0f2fe;
            color: #0369a1;
            font-size: 1.1rem;
            font-weight: 800;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.15);
        }

        #equal-buttons button {
            min-height: 11rem;
        }

        /* Sabit ve Sakin Arka Plan */
        .theme-sky { background: linear-gradient(135deg, #bae6fd, #e0f2fe); }

        html.fallback-ui body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #bae6fd, #e0f2fe);
        }

        html.fallback-ui .bg-white {
            width: min(100%, 1100px);
            padding: 32px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 48px;
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.18);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        html.fallback-ui #header-area { width: 100%; margin-bottom: 32px; }
        html.fallback-ui #header-area > div:first-child {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }

        html.fallback-ui #menu-screen .grid,
        html.fallback-ui #difficulty-screen .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        html.fallback-ui #game-screen > div:nth-child(2) {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 24px;
            margin-bottom: 32px;
        }

        html.fallback-ui #card1,
        html.fallback-ui #card2 {
            width: 42%;
            cursor: pointer;
        }

        html.fallback-ui #num-box-1,
        html.fallback-ui #num-box-2 {
            width: 100%;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            border: 6px solid #bae6fd;
            border-radius: 40px;
            background: #eff6ff;
            color: #0369a1;
            font-size: clamp(4rem, 10vw, 9rem);
            font-weight: 900;
            box-shadow: 0 12px 30px rgba(14, 165, 233, 0.12);
        }

        html.fallback-ui #items1,
        html.fallback-ui #items2 {
            margin-top: 24px;
            display: grid;
            gap: 8px;
            justify-content: center;
            grid-template-columns: repeat(5, minmax(0, max-content));
        }

        html.fallback-ui #equal-buttons {
            max-width: 900px;
            margin: 0 auto 24px;
            display: grid;
            gap: 20px;
        }

        html.fallback-ui #operator {
            width: 16%;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
        }

        @media (min-width: 768px) {
            html.fallback-ui #menu-screen .grid,
            html.fallback-ui #difficulty-screen .grid,
            html.fallback-ui #equal-buttons {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            html.fallback-ui #equal-buttons {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 767px) {
            html.fallback-ui .bg-white { padding: 24px; border-radius: 32px; }
            html.fallback-ui #game-screen > div:nth-child(2) {
                flex-direction: column;
                gap: 18px;
            }
            html.fallback-ui #card1,
            html.fallback-ui #card2,
            html.fallback-ui #operator { width: 100%; }
        }
    </style>
</head>

                <button onclick="showMenu()" class="bg-gray-200 text-gray-700 font-bold py-6 px-12 rounded-[2rem] text-3xl active:scale-95">Menüye Dön</button>

    </div>

    <script>
        window.addEventListener('load', () => {
            if (!window.tailwind) {
                document.documentElement.classList.add('fallback-ui');
            }
        });

        let currentMode = '', maxNum = 10, score = 0, questionCount = 0;
        let num1, num2, isWaiting = false, scoreAddedForQuestion = false;
        let audioCtx = null;
        const QUESTION_LABELS = {
            buyuk: 'Hangisi daha BÜYÜK?',
            kucuk: 'Hangisi daha KÜÇÜK?',
            esit: 'Sayılar EŞİT mi?'
        };
        const NARRATION_BASE_PATH = 'assets/audio/sayilari-karsilastir';
        const NARRATION_FILES = {
            question_buyuk: 'hangisi-daha-buyuk.wav',
            question_kucuk: 'hangisi-daha-kucuk.wav',
            question_esit: 'sayilar-esit-mi.wav',
            feedback_look_carefully: 'dikkatli-bak.wav',
            feedback_try_again: 'hadi-tekrar-dusun.wav',
            game_complete: 'tebrikler-oyunu-tamamladin.wav'
        };
        const narrationCache = new Map();
        const missingNarrationKeys = new Set();
        let narrationPlayer = null;
        let questionAudioTimeout = null;

        function getAudioContext() {
            if (audioCtx) return audioCtx;
            const ContextClass = window.AudioContext || window.webkitAudioContext;
            if (!ContextClass) return null;

            try {
                audioCtx = new ContextClass();
            } catch (error) {
                console.warn('Ses motoru başlatılamadı:', error);
                audioCtx = null;
            }

            return audioCtx;
        }

        function playSound(isCorrect) {
            const ctx = getAudioContext();
            if (!ctx) return;

            if(ctx.state === 'suspended') ctx.resume().catch(() => {});
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            
            if(isCorrect) {
                const notes = [523.25, 659.25, 783.99];
                notes.forEach((frequency, index) => {
                    const noteOsc = ctx.createOscillator();
                    const noteGain = ctx.createGain();
                    const startAt = ctx.currentTime + index * 0.08;
                    const duration = 0.22;

                    noteOsc.type = 'sine';
                    noteOsc.frequency.setValueAtTime(frequency, startAt);
                    noteOsc.connect(noteGain);
                    noteGain.connect(ctx.destination);
                    noteGain.gain.setValueAtTime(0.0001, startAt);
                    noteGain.gain.exponentialRampToValueAtTime(0.12, startAt + 0.02);
                    noteGain.gain.exponentialRampToValueAtTime(0.00001, startAt + duration);
                    noteOsc.start(startAt);
                    noteOsc.stop(startAt + duration);
                });
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            }
        }

        function getCurrentQuestionNarrationKey() {
            if (currentMode === 'buyuk') return 'question_buyuk';
            if (currentMode === 'kucuk') return 'question_kucuk';
            if (currentMode === 'esit') return 'question_esit';
            return null;
        }

        function getNarrationAudio(key) {
            const fileName = NARRATION_FILES[key];
            if (!fileName || missingNarrationKeys.has(key)) return null;
            if (narrationCache.has(key)) return narrationCache.get(key);

            const audio = new Audio(`${NARRATION_BASE_PATH}/${fileName}`);
            audio.preload = 'auto';
            audio.addEventListener('ended', () => {
                if (narrationPlayer === audio) narrationPlayer = null;
            });
            audio.addEventListener('error', () => {
                missingNarrationKeys.add(key);
                narrationCache.delete(key);
                if (narrationPlayer === audio) narrationPlayer = null;
                console.warn(`Ses dosyası yüklenemedi: ${fileName}`);
            }, { once: true });

            narrationCache.set(key, audio);
            return audio;
        }

        function stopNarrationPlayback() {
            if (questionAudioTimeout) {
                window.clearTimeout(questionAudioTimeout);
                questionAudioTimeout = null;
            }

            if (!narrationPlayer) return;
            narrationPlayer.pause();
            narrationPlayer.currentTime = 0;
            narrationPlayer = null;
        }

        function cancelSpeech() {
            stopNarrationPlayback();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function playNarration(key) {
            const audio = getNarrationAudio(key);
            stopNarrationPlayback();
            if (!audio) return;

            narrationPlayer = audio;
            audio.currentTime = 0;
            audio.play().catch((error) => {
                missingNarrationKeys.add(key);
                narrationCache.delete(key);
                if (narrationPlayer === audio) narrationPlayer = null;
                console.warn(`Ses dosyası oynatılamadı: ${NARRATION_FILES[key]}`, error);
            });
        }

        function queueQuestionAudio(delay = 350) {
            if (questionAudioTimeout) {
                window.clearTimeout(questionAudioTimeout);
            }

            questionAudioTimeout = window.setTimeout(() => {
                questionAudioTimeout = null;
                playQuestionAudio();
            }, delay);
        }

        function playQuestionAudio() {
            const key = getCurrentQuestionNarrationKey();
            if (!key) return;
            playNarration(key);
        }

        function setCardInteractivity(isEnabled) {
            ['card1', 'card2'].forEach((id) => {
                const card = document.getElementById(id);
                card.disabled = !isEnabled;
                card.setAttribute('aria-disabled', String(!isEnabled));
            });
        }

        function updateCardLabels() {
            document.getElementById('card1').setAttribute('aria-label', `Birinci sayı kartı: ${num1}`);
            document.getElementById('card2').setAttribute('aria-label', `İkinci sayı kartı: ${num2}`);
        }

        function getDifferentRandomNumber(limit, disallowed) {
            let value;
            do {
                value = Math.floor(Math.random() * limit) + 1;
            } while (value === disallowed);
            return value;
        }

        function fireFallbackConfetti(x, y, particleCount = 18) {
            const colors = ['#22c55e', '#f59e0b', '#3b82f6', '#ef4444', '#a855f7', '#14b8a6'];
            const burstCount = Math.max(10, Math.min(40, particleCount));

            for (let i = 0; i < burstCount; i++) {
                const piece = document.createElement('span');
                piece.className = 'fallback-confetti-piece';
                piece.style.left = `${x * window.innerWidth}px`;
                piece.style.top = `${y * window.innerHeight}px`;
                piece.style.background = colors[i % colors.length];
                piece.style.setProperty('--dx', `${(Math.random() - 0.5) * 220}px`);
                piece.style.setProperty('--dy', `${140 + Math.random() * 180}px`);
                piece.style.setProperty('--rot', `${(Math.random() - 0.5) * 720}deg`);
                document.body.appendChild(piece);
                piece.addEventListener('animationend', () => piece.remove(), { once: true });
            }
        }

        function celebrate(options) {
            if (typeof window.confetti === 'function') {
                try {
                    window.confetti(options);
                    return;
                } catch (error) {
                    console.warn('Confetti yedeğe düştü:', error);
                }
            }

            fireFallbackConfetti(options.origin?.x ?? 0.5, options.origin?.y ?? 0.45, options.particleCount);

        function showMenu() {
            cancelSpeech();
            document.querySelectorAll('.bg-white > div').forEach(d => d.classList.add('hidden'));
            document.getElementById('menu-screen').classList.remove('hidden');

            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('difficulty-screen').classList.remove('hidden');

            document.getElementById('header-area').classList.remove('hidden');
            setupUI(); generateQuestion();

        function setupUI() {
            const colors = { buyuk: 'text-green-600', kucuk: 'text-blue-600', esit: 'text-purple-600' };
            const qEl = document.getElementById('question-text');
            qEl.innerText = QUESTION_LABELS[currentMode];
            qEl.className = `text-4xl md:text-5xl font-extrabold ${colors[currentMode]}`;

        function resetCardStyles() {

                const el = document.getElementById(id);
                el.classList.remove('card-correct', 'card-wrong', 'shake-hard');

                if(id.startsWith('num-box')) el.parentElement.classList.remove('card-dimmed');
            });

            operator.innerText = 've';
            operator.className = 'text-6xl md:text-7xl font-bold text-gray-300 transition-all duration-300';
        }

        function generateQuestion() {
            if (questionCount > 10) return endGame();
            
            resetCardStyles();

            document.getElementById('q-count').innerText = questionCount;
            document.getElementById('progress-bar').style.width = (questionCount * 10) + '%';
            document.getElementById('message').innerText = 'Hadi seç bakalım!';
            document.getElementById('message').className = 'text-3xl font-bold text-gray-400 mt-6';
            
            setupUI();
            if (currentMode === 'esit') {
                document.getElementById('equal-buttons').classList.remove('hidden');
                document.getElementById('equal-buttons').style.display = 'grid';
                setCardInteractivity(false);
            } else {
                document.getElementById('equal-buttons').classList.add('hidden');
                document.getElementById('equal-buttons').style.display = 'none';
                setCardInteractivity(true);
            }

            if (currentMode === 'esit') {
                num1 = Math.floor(Math.random() * maxNum) + 1;
                num2 = Math.random() < 0.4 ? num1 : getDifferentRandomNumber(maxNum, num1);
            } else {
                do { num1 = Math.floor(Math.random() * maxNum) + 1; num2 = Math.floor(Math.random() * maxNum) + 1; } while (num1 === num2);
            }
            
            document.getElementById('num-box-1').innerText = num1;
            document.getElementById('num-box-2').innerText = num2;
            updateCardLabels();
            
            drawVisualItems(num1, 'items1'); drawVisualItems(num2, 'items2');
            isWaiting = false;
            queueQuestionAudio(questionCount === 1 ? 500 : 300);
        }

        function drawVisualItems(num, elementId) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            // Sadece 10'a kadar olan seviyede elmalar çıkar
            if (maxNum !== 10) return;
            
            for (let i = 0; i < num; i++) {
                const item = document.createElement('div');
                item.innerText = '🍎'; // Soyut noktalar yerine somut elma
                item.className = 'text-3xl md:text-4xl';
                container.appendChild(item);
            }
        }

        function showOperatorFeedback() {
            const op = document.getElementById('operator');
            if (num1 > num2) { op.innerText = '>'; op.style.color = '#ef4444'; }
            else if (num1 < num2) { op.innerText = '<'; op.style.color = '#ef4444'; }
            else { op.innerText = '='; op.style.color = '#22c55e'; }
            op.className = 'text-[7rem] md:text-[10rem] font-black transition-all duration-300 pop-in';
        }

        function handleCardClick(id) {
            if (isWaiting || currentMode === 'esit') return;
            const isCorrect = currentMode === 'buyuk' ? (id === 1 ? num1 > num2 : num2 > num1) : (id === 1 ? num1 < num2 : num2 < num1);
            const targetId = `num-box-${id}`;
            const otherId = `num-box-${id === 1 ? 2 : 1}`;
            processAnswer(isCorrect, document.getElementById(targetId), document.getElementById(otherId));
        }

        function handleEqualClick(val) {
            if (isWaiting) return;
            const isEqual = (num1 === num2);
            const isCorrect = (val === isEqual);
            const target = document.getElementById(val ? 'btn-equal-true' : 'btn-equal-false');
            const other = document.getElementById(val ? 'btn-equal-false' : 'btn-equal-true');
            processAnswer(isCorrect, target, other, true);
        }

        function processAnswer(correct, targetElement, otherElement, isFromEqualButton = false) {
            isWaiting = true;
            const msg = document.getElementById('message');
            
            if (correct) {
                if(!isFromEqualButton) {
                    targetElement.classList.add('card-correct');
                    otherElement.parentElement.classList.add('card-dimmed');
                } else {
                    targetElement.classList.add('card-correct');
                    otherElement.style.opacity = '0.4';
                }

                showOperatorFeedback(); 

                if (!scoreAddedForQuestion) score += 10;
                playSound(true);
                msg.innerText = 'Harika! Doğru bildin 🌟'; 
                msg.className = 'text-4xl font-bold text-green-500 bounce-short mt-6';
                
                const rect = targetElement.getBoundingClientRect();
                const x = (rect.left + rect.width / 2) / window.innerWidth;
                const y = (rect.top + rect.height / 2) / window.innerHeight;
                celebrate({ particleCount: 50, spread: 70, origin: { x: x, y: y }, zIndex: 100 });

                setTimeout(() => { 
                    if(isFromEqualButton) otherElement.style.opacity = '1';
                    questionCount++; 
                    generateQuestion(); 
                }, 2000);

            } else {
                scoreAddedForQuestion = true; 
                playSound(false);
                playNarration('feedback_look_carefully');
                targetElement.classList.add('card-wrong', 'shake-hard');
                
                showOperatorFeedback(); 
                
                msg.innerText = 'Dikkatli bak! 🤔'; 
                msg.className = 'text-4xl font-bold text-red-500 mt-6';
                
                setTimeout(() => { 
                    targetElement.classList.remove('card-wrong', 'shake-hard');
                    const op = document.getElementById('operator');
                    op.innerText = 've';
                    op.className = 'text-6xl md:text-7xl font-bold text-gray-300 transition-all duration-300';
                    
                    msg.innerText = 'Hadi tekrar düşün!'; 
                    msg.className = 'text-3xl font-bold text-gray-400 mt-6';
                    isWaiting = false;
                    playNarration('feedback_try_again');
                    queueQuestionAudio(1100);
                }, 1500);
            }
        }

        function endGame() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('header-area').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            let stars = '';
            if(score >= 80) stars = '⭐⭐⭐';
            else if(score >= 50) stars = '⭐⭐';
            else stars = '⭐';
            
            document.getElementById('star-rating').innerText = stars;
            celebrate({ particleCount: 300, spread: 150, origin: { y: 0.6 } });
            playNarration('game_complete');
        }

                if (ones > 0) {

                    ? (id === 1 ? num1 > num2 : num2 > num1)
                    : (id === 1 ? num1 < num2 : num2 < num1);

                const targetId = `num-box-${id}`;
                const otherId = `num-box-${id === 1 ? 2 : 1}`;
                processAnswer(isCorrect, document.getElementById(targetId), document.getElementById(otherId));
            };

            handleEqualClick = function(value) {
                if (isWaiting || activeMode !== 'esit') return;
                const isEqual = num1 === num2;
                const isCorrect = value === isEqual;
                const target = document.getElementById(value ? 'btn-equal-true' : 'btn-equal-false');
                const other = document.getElementById(value ? 'btn-equal-false' : 'btn-equal-true');
                processAnswer(isCorrect, target, other, true);
            };

            processAnswer = function(correct, targetElement, otherElement, isFromEqualButton = false) {
                isWaiting = true;
                const message = document.getElementById('message');

                if (correct) {
                    if (!isFromEqualButton) {
                        targetElement.classList.add('card-correct');
                        if (otherElement && otherElement.parentElement) otherElement.parentElement.classList.add('card-dimmed');
                    } else {
                        targetElement.classList.add('card-correct');
                        if (otherElement) otherElement.style.opacity = '0.4';
                    }

                    showOperatorFeedback();
                    if (!scoreAddedForQuestion) score += 10;
                    scoreAddedForQuestion = true;
                    stats.correct += 1;
                    stats.mode[activeMode].correct += 1;
                    correctStreak += 1;
                    stats.highestStreak = Math.max(stats.highestStreak, correctStreak);
                    playSound(true);

                    const streakMilestone = correctStreak >= 3 && correctStreak % 3 === 0;
                    message.innerText = streakMilestone ? 'Super! Seri yaptin!' : 'Harika! Dogru bildin!';
                    message.className = 'text-4xl font-bold text-green-500 bounce-short mt-6';

                    const rect = targetElement.getBoundingClientRect();
                    const origin = {
                        x: (rect.left + rect.width / 2) / window.innerWidth,
                        y: (rect.top + rect.height / 2) / window.innerHeight
                    };

                    celebrate({ particleCount: streakMilestone ? 75 : 50, spread: 70, origin, zIndex: 100 });

                    if (streakMilestone) {
                        flashStreakBadge();
                    }

                    updateHeaderBadges();

                    setTimeout(() => {
                        if (isFromEqualButton && otherElement) otherElement.style.opacity = '1';
                        adjustDifficulty(true);
                        questionCount += 1;
                        generateQuestion();
                    }, 1800);

                    return;
                }

                scoreAddedForQuestion = true;
                stats.incorrect += 1;
                stats.mode[activeMode].incorrect += 1;
                correctStreak = 0;
                playSound(false);
                playNarration('feedback_look_carefully');
                targetElement.classList.add('card-wrong', 'shake-hard');
                message.innerText = 'Dikkatli bak!';
                message.className = 'text-4xl font-bold text-red-500 mt-6';
                updateHeaderBadges();

                setTimeout(() => {
                    showHelpfulHint(isFromEqualButton);
                    message.innerText = activeMode === 'esit' ? 'Ipuclari incele. Evet mi, Hayir mi?' : 'Ipuclari incele ve tekrar dene!';
                    message.className = 'text-3xl font-bold text-amber-500 mt-6';
                }, 650);

                setTimeout(() => {
                    adjustDifficulty(false);
                    resetCardStyles();
                    message.innerText = 'Hadi tekrar dusun!';
                    message.className = 'text-3xl font-bold text-gray-400 mt-6';
                    isWaiting = false;
                    updateHeaderBadges();
                    playNarration('feedback_try_again');
                    queueQuestionAudio(1000);
                }, 1850);
            };

            endGame = function() {
                maxNum = selectedMaxNum;
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('header-area').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');

                const stars = score >= 80 ? '★★★' : (score >= 50 ? '★★' : '★');
                document.getElementById('star-rating').innerText = stars;

                const teacherSummary = document.getElementById('teacher-summary');
                if (teacherSummary) {
                    teacherSummary.innerHTML = buildSummaryHtml();
                }

                celebrate({ particleCount: 300, spread: 150, origin: { y: 0.6 } });
                playNarration('game_complete');
            };

            window.toggleSound = function() {
                soundEnabled = !soundEnabled;
                if (!soundEnabled) cancelSpeech();
                updateHeaderBadges();
            };

            window.toggleSmartboardMode = function() {
                smartboardMode = !smartboardMode;
                updateHeaderBadges();
            };

            ensureUiEnhancements();
            updateHeaderBadges();
        })();
    </script>
</body>
</html>
