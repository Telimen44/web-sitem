<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Şekil Eşleştirme Oyunu V4.0</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* Prevent Pull-to-Refresh and Zoom on Touch Devices */
        * {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overscroll-behavior-y: contain;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Flat Shape Shadows (No borders) */
        .shape-shadow {
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.15));
        }

        /* Shake Animation Keyframes */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-12px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translateX(12px);
            }
        }

        .shake-animation {
            animation: shake 0.5s ease-in-out;
        }
    </style>
    <!-- Vercel Web Analytics -->
    <script src="/analytics.js"></script>
</head>

<body class="bg-gradient-to-br from-sky-100 via-indigo-50 to-purple-100 overflow-hidden select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- Audio Context for Sound Synthesis ---
        let audioContext = null;

        const initAudioContext = () => {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            return audioContext;
        };

        // Correct Sound: High-pitched "Ding" (Sine Wave)
        const playCorrectSound = (enabled = true) => {
            if (!enabled) return;
            const ctx = initAudioContext();
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, ctx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.1);

            gainNode.gain.setValueAtTime(0.4, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);

            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);

            oscillator.start(ctx.currentTime);
            oscillator.stop(ctx.currentTime + 0.4);
        };

        // Wrong Sound: Low-pitched "Bop" (Triangle Wave)
        const playWrongSound = (enabled = true) => {
            if (!enabled) return;
            const ctx = initAudioContext();
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();

            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(150, ctx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.15);

            gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);

            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);

            oscillator.start(ctx.currentTime);
            oscillator.stop(ctx.currentTime + 0.2);
        };

        // Start Game Sound: Rising chime
        const playStartSound = (enabled = true) => {
            if (!enabled) return;
            const ctx = initAudioContext();
            const notes = [523, 659, 784]; // C5, E5, G5

            notes.forEach((freq, i) => {
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.15);

                gainNode.gain.setValueAtTime(0, ctx.currentTime + i * 0.15);
                gainNode.gain.linearRampToValueAtTime(0.3, ctx.currentTime + i * 0.15 + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.3);

                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);

                oscillator.start(ctx.currentTime + i * 0.15);
                oscillator.stop(ctx.currentTime + i * 0.15 + 0.3);
            });
        };

        // TTS Voice Loader (Google Türkçe öncelikli)
        let _ttsVoice = null;
        let _ttsVoicesLoaded = false;
        const _loadTTSVoice = () => {
            const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
            if (voices.length === 0) return;
            const trVoices = voices.filter(v => v.lang === 'tr-TR' || v.lang.startsWith('tr'));
            const googleVoice = trVoices.find(v => v.name.includes('Google'));
            _ttsVoice = googleVoice || trVoices[0] || null;
            _ttsVoicesLoaded = true;
            if (_ttsVoice) console.log('🗣️ Voice:', _ttsVoice.name);
        };
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = _loadTTSVoice;
            _loadTTSVoice();
        }

        const AI_AUDIO_BASE = 'assets/audio/gor-ve-sec';
        let _ttsAudioPlayer = null;
        const _failedWordAudio = new Set();

        const normalizeAudioKey = (text) => String(text || '')
            .replace(/I/g, 'ı')
            .replace(/İ/g, 'i')
            .toLowerCase()
            .replace(/ç/g, 'c')
            .replace(/ğ/g, 'g')
            .replace(/ı/g, 'i')
            .replace(/ö/g, 'o')
            .replace(/ş/g, 's')
            .replace(/ü/g, 'u')
            .replace(/[^a-z0-9]/g, '');

        const stopChildFriendlyAudio = () => {
            if (!_ttsAudioPlayer) return;
            _ttsAudioPlayer.pause();
            _ttsAudioPlayer.currentTime = 0;
            _ttsAudioPlayer = null;
        };

        const speakFallbackTTS = (text) => {
            if (!window.speechSynthesis) return;
            stopChildFriendlyAudio();
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        };

        const speakWithChildFriendlyVoice = (text) => {
            if (String(text || '').trim().split(/\s+/).length > 1) {
                speakFallbackTTS(text);
                return;
            }

            const key = normalizeAudioKey(text);
            if (!key || _failedWordAudio.has(key)) {
                speakFallbackTTS(text);
                return;
            }

            stopChildFriendlyAudio();
            if (window.speechSynthesis) window.speechSynthesis.cancel();

            const audio = new Audio(`${AI_AUDIO_BASE}/${key}.mp3`);
            _ttsAudioPlayer = audio;
            let handled = false;

            const fallbackToTTS = () => {
                if (handled) return;
                handled = true;
                _failedWordAudio.add(key);
                if (_ttsAudioPlayer === audio) _ttsAudioPlayer = null;
                speakFallbackTTS(text);
            };

            audio.addEventListener('ended', () => {
                if (_ttsAudioPlayer === audio) _ttsAudioPlayer = null;
            }, { once: true });
            audio.addEventListener('error', fallbackToTTS, { once: true });
            audio.play().catch(fallbackToTTS);
        };

        // Text-to-Speech for Turkish Instructions
        const speakInstruction = (shapeName, enabled = true) => {
            if (!enabled) return;
            setTimeout(() => {
                speakWithChildFriendlyVoice(`${shapeName} Bul`);
            }, 100);
        };

        // --- Game Data & Config ---
        const SHAPES = [
            { id: 'kare', name: 'KARE', displayName: 'Kareyi', color: 'bg-orange-400', type: 'rounded-3xl' },
            { id: 'daire', name: 'DAİRE', displayName: 'Daireyi', color: 'bg-sky-400', type: 'rounded-full' },
            { id: 'ucgen', name: 'ÜÇGEN', displayName: 'Üçgeni', color: 'bg-rose-400', clipPath: 'polygon(50% 0%, 0% 100%, 100% 100%)' },
            { id: 'yildiz', name: 'YILDIZ', displayName: 'Yıldızı', color: 'bg-amber-400', clipPath: 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)' },
            { id: 'dikdortgen', name: 'DİKDÖRTGEN', displayName: 'Dikdörtgeni', color: 'bg-violet-400', type: 'rounded-2xl', isWide: true },
            { id: 'besgen', name: 'BEŞGEN', displayName: 'Beşgeni', color: 'bg-emerald-400', clipPath: 'polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%)' },
        ];

        const TOTAL_LEVELS = 10;
        const SAVE_KEY = 'sekilEslestirmeSave';
        const SETTINGS_KEY = 'sekilEslestirmeSettings';

        const loadJSON = (key, fallback) => {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return fallback;
                const parsed = JSON.parse(raw);
                return parsed ?? fallback;
            } catch (e) {
                return fallback;
            }
        };

        // --- Components ---

        // Start Screen Component
        const StartScreen = ({ onStart, onContinue, onClearSave, hasSave, reduceMotion }) => {
            return (
                <div className="relative flex flex-col items-center justify-center h-screen overflow-hidden">
                    <div className="absolute inset-0 z-0 pointer-events-none">
                        <div className="absolute inset-0 bg-[radial-gradient(1200px_700px_at_15%_10%,rgba(99,102,241,0.30),transparent_60%),radial-gradient(900px_600px_at_85%_15%,rgba(56,189,248,0.20),transparent_62%),radial-gradient(1100px_700px_at_50%_100%,rgba(168,85,247,0.25),transparent_62%),linear-gradient(140deg,#050816_0%,#111b3f_42%,#122a3f_70%,#0f2f2b_100%)]"></div>
                        <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_55%,rgba(2,6,23,0.55)_100%)]"></div>
                        <div className="absolute -left-24 -top-20 h-80 w-80 rounded-full bg-indigo-400/20 blur-3xl"></div>
                        <div className="absolute -right-24 top-24 h-96 w-96 rounded-full bg-cyan-300/15 blur-3xl"></div>
                        <div className="absolute left-1/3 -bottom-32 h-96 w-96 rounded-full bg-fuchsia-400/20 blur-3xl"></div>
                    </div>
                    <motion.div
                        initial={{ scale: 0.8, opacity: 0 }}
                        animate={{ scale: 1, opacity: 1 }}
                        transition={reduceMotion ? { duration: 0 } : { type: "spring", stiffness: 200, damping: 20 }}
                        className="relative z-10 text-center"
                    >
                        <div className="flex justify-center gap-6 mb-8">
                            <motion.div
                                animate={reduceMotion ? {} : { y: [0, -10, 0] }}
                                transition={reduceMotion ? { duration: 0 } : { repeat: Infinity, duration: 2, delay: 0 }}
                                className="w-16 h-16 bg-orange-400 rounded-xl shape-shadow"
                            />
                            <motion.div
                                animate={reduceMotion ? {} : { y: [0, -10, 0] }}
                                transition={reduceMotion ? { duration: 0 } : { repeat: Infinity, duration: 2, delay: 0.3 }}
                                className="w-16 h-16 bg-sky-400 rounded-full shape-shadow"
                            />
                            <motion.div
                                animate={reduceMotion ? {} : { y: [0, -10, 0] }}
                                transition={reduceMotion ? { duration: 0 } : { repeat: Infinity, duration: 2, delay: 0.6 }}
                                className="w-16 h-16 bg-rose-400 shape-shadow"
                                style={{ clipPath: 'polygon(50% 0%, 0% 100%, 100% 100%)' }}
                            />
                        </div>

                        <h1 className="text-5xl lg:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-200 via-violet-200 to-fuchsia-200 mb-4 drop-shadow-[0_4px_18px_rgba(0,0,0,0.35)]">
                            ŞEKİL EŞLEŞTİRME
                        </h1>
                        <p className="text-2xl lg:text-3xl text-slate-100/90 mb-12">
                            Doğru şekli bul!
                        </p>

                        <div className="flex flex-col items-center gap-4">
                            <motion.button
                                whileHover={{ scale: 1.05 }}
                                whileTap={{ scale: 0.95 }}
                                onClick={onStart}
                                className="bg-gradient-to-r from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600 text-white text-4xl lg:text-5xl font-black py-8 px-16 lg:py-10 lg:px-20 rounded-full shadow-2xl min-h-[120px] min-w-[350px]"
                            >
                                🎮 OYUNA BAŞLA
                            </motion.button>
                            {hasSave && (
                                <div className="flex flex-wrap justify-center gap-3">
                                    <button
                                        onClick={onContinue}
                                        className="bg-white/90 hover:bg-white text-indigo-700 text-xl lg:text-2xl font-bold py-3 px-6 rounded-2xl shadow-lg"
                                    >
                                        Devam Et
                                    </button>
                                    <button
                                        onClick={onClearSave}
                                        className="bg-slate-800/80 hover:bg-slate-700 text-white text-lg lg:text-xl font-semibold py-3 px-6 rounded-2xl shadow-lg"
                                    >
                                        Kaydı Sıfırla
                                    </button>
                                </div>
                            )}
                        </div>
                    </motion.div>
                </div>
            );
        };

        // Progress Bar Component
        const ProgressBar = ({ current, total }) => {
            const percentage = ((current - 1) / total) * 100;

            return (
                <div className="w-full px-4 lg:px-8">
                    <div className="h-5 lg:h-6 bg-slate-200 rounded-full overflow-hidden shadow-inner">
                        <motion.div
                            initial={{ width: 0 }}
                            animate={{ width: `${percentage}%` }}
                            transition={{ type: "spring", stiffness: 100, damping: 20 }}
                            className="h-full bg-gradient-to-r from-green-400 to-emerald-500 rounded-full"
                        />
                    </div>
                    <div className="text-center mt-2 text-lg lg:text-xl font-bold text-slate-600">
                        {current - 1} / {total} Tamamlandı
                    </div>
                </div>
            );
        };

        // Shape Card Component (Flat Design - No Borders)
        const ShapeCard = ({ shape, onClick, isWrong, isShaking, disabled }) => {
            const baseSize = shape.isWide
                ? 'w-64 h-44 lg:w-72 lg:h-48 xl:w-80 xl:h-52'
                : 'w-44 h-44 lg:w-52 lg:h-52 xl:w-60 xl:h-60';

            return (
                <motion.button
                    initial={{ scale: 0, opacity: 0 }}
                    animate={{
                        scale: 1,
                        opacity: isWrong ? 0 : 1,
                    }}
                    transition={{
                        type: "spring",
                        stiffness: 300,
                        damping: 20,
                        opacity: { delay: isShaking ? 0.5 : 0, duration: 0.3 }
                    }}
                    whileTap={!disabled ? { scale: 0.9 } : {}}
                    className={`
                        relative flex items-center justify-center
                        ${baseSize}
                        m-3 lg:m-4 cursor-pointer
                        shape-shadow
                        ${!shape.clipPath ? shape.color : ''}
                        ${shape.type || ''}
                        ${isShaking ? 'shake-animation' : ''}
                        ${isWrong ? 'pointer-events-none' : ''}
                        ${disabled ? 'pointer-events-none' : ''}
                    `}
                    style={{ visibility: isWrong ? 'hidden' : 'visible' }}
                    onClick={onClick}
                    disabled={disabled || isWrong}
                >
                    {shape.clipPath && (
                        <div
                            className={`w-full h-full ${shape.color}`}
                            style={{ clipPath: shape.clipPath }}
                        />
                    )}
                </motion.button>
            );
        };

        // Reward Overlay Component
        const RewardOverlay = ({ onComplete }) => {
            useEffect(() => {
                const duration = 1500;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

                const interval = setInterval(() => {
                    const timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) {
                        clearInterval(interval);
                        return;
                    }
                    const particleCount = 50 * (timeLeft / duration);
                    confetti({ ...defaults, particleCount, origin: { x: Math.random() * 0.4 + 0.1, y: Math.random() - 0.2 } });
                    confetti({ ...defaults, particleCount, origin: { x: Math.random() * 0.4 + 0.5, y: Math.random() - 0.2 } });
                }, 150);

                const timer = setTimeout(onComplete, 1500);
                return () => {
                    clearTimeout(timer);
                    clearInterval(interval);
                };
            }, [onComplete]);

            return (
                <motion.div
                    initial={{ scale: 0, opacity: 0 }}
                    animate={{ scale: 1, opacity: 1 }}
                    exit={{ scale: 0, opacity: 0 }}
                    className="fixed inset-0 flex items-center justify-center z-50 pointer-events-none"
                >
                    <motion.div
                        initial={{ scale: 0, rotate: -180 }}
                        animate={{ scale: 1, rotate: 0 }}
                        transition={{ type: "spring", stiffness: 200, damping: 15 }}
                        className="text-[180px] lg:text-[220px]"
                    >
                        ⭐
                    </motion.div>
                </motion.div>
            );
        };

        // Main Game Component
        const Game = () => {
            const [gameStarted, setGameStarted] = useState(false);
            const [level, setLevel] = useState(1);
            const [score, setScore] = useState(0);
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [wrongAnswers, setWrongAnswers] = useState({});
            const [wrongCount, setWrongCount] = useState(0);
            const [feedbackMsg, setFeedbackMsg] = useState('');
            const [feedbackType, setFeedbackType] = useState('info');
            const [hintText, setHintText] = useState('');
            const [isCompleted, setIsCompleted] = useState(false);
            const [showReward, setShowReward] = useState(false);
            const [isTransitioning, setIsTransitioning] = useState(false);
            const [hasSave, setHasSave] = useState(false);
            const [fullscreenAvailable, setFullscreenAvailable] = useState(!!document.fullscreenEnabled);
            const [soundOn, setSoundOn] = useState(true);
            const [ttsOn, setTtsOn] = useState(true);
            const [reduceMotion, setReduceMotion] = useState(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
            const lastTapRef = useRef({ shapeId: null, at: 0 });
            const feedbackTimerRef = useRef(null);

            useEffect(() => {
                const settings = loadJSON(SETTINGS_KEY, null);
                if (settings) {
                    if (typeof settings.soundOn === 'boolean') setSoundOn(settings.soundOn);
                    if (typeof settings.ttsOn === 'boolean') setTtsOn(settings.ttsOn);
                    if (typeof settings.reduceMotion === 'boolean') setReduceMotion(settings.reduceMotion);
                }
                const saved = loadJSON(SAVE_KEY, null);
                if (saved && Number.isFinite(saved.level) && Number.isFinite(saved.score)) {
                    setHasSave(true);
                }
            }, []);

            useEffect(() => {
                localStorage.setItem(SETTINGS_KEY, JSON.stringify({ soundOn, ttsOn, reduceMotion }));
            }, [soundOn, ttsOn, reduceMotion]);

            useEffect(() => {
                if (!window.matchMedia) return;
                const media = window.matchMedia('(prefers-reduced-motion: reduce)');
                const onChange = (e) => {
                    const settings = loadJSON(SETTINGS_KEY, null);
                    if (!settings || typeof settings.reduceMotion !== 'boolean') {
                        setReduceMotion(e.matches);
                    }
                };
                if (media.addEventListener) media.addEventListener('change', onChange);
                else media.addListener(onChange);
                return () => {
                    if (media.removeEventListener) media.removeEventListener('change', onChange);
                    else media.removeListener(onChange);
                };
            }, []);

            useEffect(() => {
                const onFsChange = () => setFullscreenAvailable(!!document.fullscreenEnabled);
                document.addEventListener('fullscreenchange', onFsChange);
                return () => document.removeEventListener('fullscreenchange', onFsChange);
            }, []);

            const showFeedback = useCallback((text, type = 'info', durationMs = 0) => {
                setFeedbackMsg(text);
                setFeedbackType(type);
                if (feedbackTimerRef.current) clearTimeout(feedbackTimerRef.current);
                if (durationMs > 0) {
                    feedbackTimerRef.current = setTimeout(() => {
                        setFeedbackMsg('');
                        setFeedbackType('info');
                    }, durationMs);
                }
            }, []);

            const handleStartGame = () => {
                initAudioContext();
                playStartSound(soundOn);
                setLevel(1);
                setScore(0);
                setWrongCount(0);
                setHintText('');
                setFeedbackMsg('');
                localStorage.removeItem(SAVE_KEY);
                setHasSave(false);
                setGameStarted(true);
            };

            const handleContinueGame = () => {
                const saved = loadJSON(SAVE_KEY, null);
                if (!saved || !Number.isFinite(saved.level) || !Number.isFinite(saved.score)) {
                    localStorage.removeItem(SAVE_KEY);
                    setHasSave(false);
                    return;
                }
                initAudioContext();
                playStartSound(soundOn);
                setLevel(Math.max(1, Math.min(TOTAL_LEVELS, Math.floor(saved.level))));
                setScore(Math.max(0, Math.floor(saved.score)));
                setWrongCount(0);
                setHintText('');
                setFeedbackMsg('');
                setGameStarted(true);
            };

            const handleClearSave = () => {
                localStorage.removeItem(SAVE_KEY);
                setHasSave(false);
            };

            const handleRepeatInstruction = () => {
                if (!currentQuestion?.target) return;
                speakInstruction(currentQuestion.target.displayName, ttsOn);
            };

            const toggleFullscreen = () => {
                if (!document.fullscreenEnabled) return;
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen?.().catch(() => { });
                } else {
                    document.exitFullscreen?.().catch(() => { });
                }
            };

            const generateQuestion = useCallback(() => {
                if (level > TOTAL_LEVELS) {
                    setIsCompleted(true);
                    fireEndConfetti();
                    return;
                }

                const numOptions = level <= 3 ? 2 : 3;
                const targetShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];

                let options = [targetShape];
                while (options.length < numOptions) {
                    const randomShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                    if (!options.find(o => o.id === randomShape.id)) {
                        options.push(randomShape);
                    }
                }

                options = options.sort(() => Math.random() - 0.5);

                setCurrentQuestion({
                    target: targetShape,
                    options: options
                });
                setWrongAnswers({});
                setWrongCount(0);
                setHintText('');
                setFeedbackMsg('');
                setIsTransitioning(false);
            }, [level]);

            useEffect(() => {
                if (gameStarted && !isCompleted) {
                    generateQuestion();
                }
            }, [level, gameStarted, generateQuestion, isCompleted]);

            useEffect(() => {
                if (!currentQuestion?.target || !gameStarted || isCompleted) return;
                const t = setTimeout(() => {
                    speakInstruction(currentQuestion.target.displayName, ttsOn);
                }, 300);
                return () => clearTimeout(t);
            }, [currentQuestion, gameStarted, isCompleted, ttsOn]);

            useEffect(() => {
                if (!gameStarted || isCompleted) return;
                localStorage.setItem(SAVE_KEY, JSON.stringify({ level, score }));
                setHasSave(true);
            }, [level, score, gameStarted, isCompleted]);

            useEffect(() => {
                if (!isCompleted) return;
                localStorage.removeItem(SAVE_KEY);
                setHasSave(false);
            }, [isCompleted]);

            useEffect(() => {
                return () => {
                    if (feedbackTimerRef.current) clearTimeout(feedbackTimerRef.current);
                };
            }, []);

            const handleOptionClick = (shape) => {
                if (isCompleted || isTransitioning || wrongAnswers[shape.id]?.isHidden) return;

                const now = performance.now();
                if (lastTapRef.current.shapeId === shape.id && (now - lastTapRef.current.at) < 220) return;
                lastTapRef.current = { shapeId: shape.id, at: now };

                if (shape.id === currentQuestion.target.id) {
                    setIsTransitioning(true);
                    showFeedback('Doğru! Harika seçim.', 'correct', 900);
                    playCorrectSound(soundOn);
                    setScore(s => s + 10);
                    setShowReward(true);
                } else {
                    const nextWrong = wrongCount + 1;
                    setWrongCount(nextWrong);
                    playWrongSound(soundOn);
                    showFeedback('Yanlış. Tekrar dene.', 'wrong', 1300);
                    if (nextWrong >= 2) {
                        setHintText(`İpucu: ${currentQuestion.target.displayName} bul. Kalan seçeneklere dikkat et!`);
                    }

                    setWrongAnswers(prev => ({
                        ...prev,
                        [shape.id]: { isShaking: true, isHidden: false }
                    }));

                    setTimeout(() => {
                        setWrongAnswers(prev => ({
                            ...prev,
                            [shape.id]: { isShaking: false, isHidden: true }
                        }));
                    }, 500);
                }
            };

            const handleRewardComplete = () => {
                setShowReward(false);
                setLevel(l => l + 1);
            };

            const fireEndConfetti = () => {
                const duration = 5 * 1000;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 100, zIndex: 0 };

                const interval = setInterval(() => {
                    const timeLeft = animationEnd - Date.now();

                    if (timeLeft <= 0) {
                        return clearInterval(interval);
                    }

                    const particleCount = 80 * (timeLeft / duration);
                    confetti({ ...defaults, particleCount, origin: { x: Math.random() * 0.3 + 0.1, y: Math.random() - 0.2 } });
                    confetti({ ...defaults, particleCount, origin: { x: Math.random() * 0.3 + 0.6, y: Math.random() - 0.2 } });
                }, 200);
            };

            const restartGame = () => {
                setLevel(1);
                setScore(0);
                setIsCompleted(false);
                setWrongAnswers({});
                setWrongCount(0);
                setHintText('');
                setFeedbackMsg('');
                setShowReward(false);
                setIsTransitioning(false);
                localStorage.removeItem(SAVE_KEY);
                setHasSave(false);
            };

            if (!gameStarted) {
                return (
                    <StartScreen
                        onStart={handleStartGame}
                        onContinue={handleContinueGame}
                        onClearSave={handleClearSave}
                        hasSave={hasSave}
                        reduceMotion={reduceMotion}
                    />
                );
            }

            if (isCompleted) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen">
                        <motion.div
                            initial={{ scale: 0.5, opacity: 0 }}
                            animate={{ scale: 1, opacity: 1 }}
                            className="bg-white/90 backdrop-blur-sm p-10 lg:p-14 rounded-[3rem] shadow-2xl text-center max-w-3xl w-full mx-4"
                        >
                            <motion.div
                                initial={{ scale: 0 }}
                                animate={{ scale: 1 }}
                                transition={{ delay: 0.2, type: "spring" }}
                                className="text-7xl lg:text-8xl mb-4"
                            >
                                ??
                            </motion.div>
                            <h1 className="text-5xl lg:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600 mb-4">
                                TEBRİKLER!
                            </h1>
                            <p className="text-xl lg:text-2xl text-slate-600 mb-6">Harika bir iş çıkardın!</p>
                            <div className="text-3xl lg:text-4xl font-bold text-orange-500 mb-8 bg-orange-50 py-3 px-6 rounded-2xl inline-block">
                                Toplam Puan: {score}
                            </div>
                            <br />
                            <button
                                onClick={restartGame}
                                className="bg-gradient-to-r from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600 text-white text-2xl lg:text-3xl font-bold py-5 px-12 rounded-full shadow-xl transform transition active:scale-95 mt-4"
                            >
                                Tekrar Oyna 🔄
                            </button>
                        </motion.div>
                    </div>
                );
            }

            if (!currentQuestion) return null;

            return (
                <div className="flex flex-col h-screen max-h-screen">
                    <AnimatePresence>
                        {showReward && <RewardOverlay onComplete={handleRewardComplete} />}
                    </AnimatePresence>

                    <header className="flex justify-between items-center p-3 lg:p-4 bg-white/80 backdrop-blur-sm shadow-sm z-10 gap-2">
                        <a href="index.html" className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-base lg:text-lg font-bold py-2 px-4 lg:px-5 rounded-xl transition">
                            🏠 Ana Sayfa
                        </a>
                        <div className="flex items-center gap-2 lg:gap-3">
                            <div className="text-lg lg:text-xl font-bold text-slate-700 bg-slate-100 px-4 py-2 rounded-xl">
                                Deneme: {wrongCount}
                            </div>
                            <div className="text-xl lg:text-2xl font-bold text-orange-600 bg-orange-50 px-5 py-2 rounded-xl">
                                Puan: {score}
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setSoundOn(v => !v)} className={`text-xs lg:text-sm font-bold py-2 px-3 rounded-lg ${soundOn ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}`}>
                                Ses {soundOn ? 'Açık' : 'Kapalı'}
                            </button>
                            <button onClick={() => setTtsOn(v => !v)} className={`text-xs lg:text-sm font-bold py-2 px-3 rounded-lg ${ttsOn ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-200 text-slate-600'}`}>
                                Yönerge {ttsOn ? 'Açık' : 'Kapalı'}
                            </button>
                            <button onClick={() => setReduceMotion(v => !v)} className={`text-xs lg:text-sm font-bold py-2 px-3 rounded-lg ${reduceMotion ? 'bg-amber-100 text-amber-700' : 'bg-slate-200 text-slate-600'}`}>
                                Animasyon {reduceMotion ? 'Az' : 'Normal'}
                            </button>
                            {fullscreenAvailable && (
                                <button onClick={toggleFullscreen} className="text-xs lg:text-sm font-bold py-2 px-3 rounded-lg bg-slate-900 text-white">
                                    Tam Ekran
                                </button>
                            )}
                        </div>
                    </header>

                    <div className="py-3 lg:py-4 bg-white/60">
                        <ProgressBar current={level} total={TOTAL_LEVELS} />
                    </div>

                    <main className="flex-1 flex flex-col items-center">
                        <div className="mt-6 lg:mt-10 mb-6 lg:mb-8 text-center">
                            <motion.h2
                                key={`${level}-${currentQuestion.target.name}`}
                                initial={{ y: -20, opacity: 0 }}
                                animate={{ y: 0, opacity: 1 }}
                                className="text-5xl lg:text-6xl xl:text-7xl font-black tracking-wide"
                            >
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600">
                                    {currentQuestion.target.displayName.toUpperCase()}
                                </span>
                                <span className="text-slate-700 ml-2 lg:ml-3">BUL!</span>
                            </motion.h2>
                            <div className="mt-4 flex items-center justify-center gap-2">
                                <button
                                    onClick={handleRepeatInstruction}
                                    className="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 text-base lg:text-lg font-bold px-5 py-2 rounded-xl"
                                >
                                    Tekrar Söyle
                                </button>
                            </div>
                            {feedbackMsg && (
                                <div className={`mt-4 text-2xl lg:text-3xl font-black px-6 py-3 rounded-2xl inline-block shadow ${feedbackType === 'wrong' ? 'bg-amber-100 text-amber-800 border-2 border-amber-300' : 'bg-emerald-100 text-emerald-700 border-2 border-emerald-300'}`}>
                                    {feedbackMsg}
                                </div>
                            )}
                            {hintText && (
                                <div className="mt-3 text-lg lg:text-xl font-semibold text-slate-700 bg-slate-100/90 px-5 py-2 rounded-xl inline-block">
                                    {hintText}
                                </div>
                            )}
                        </div>

                        <div className="flex-1 w-full flex items-center justify-center pb-12 lg:pb-16">
                            <div className="flex flex-wrap justify-center items-center gap-6 lg:gap-10 xl:gap-12 max-w-6xl px-4">
                                {currentQuestion.options.map((shape, index) => (
                                    <ShapeCard
                                        key={`${level}-${shape.id}-${index}`}
                                        shape={shape}
                                        isWrong={wrongAnswers[shape.id]?.isHidden}
                                        isShaking={wrongAnswers[shape.id]?.isShaking}
                                        disabled={isTransitioning}
                                        onClick={() => handleOptionClick(shape)}
                                    />
                                ))}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Game />);
    </script>
<script>
(function(){
  document.addEventListener("contextmenu", function(e){ e.preventDefault(); }, { capture: true });
})();
</script>
</body>

</html>
