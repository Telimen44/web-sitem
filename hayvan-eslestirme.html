    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #5f27cd 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Header --- */
        header {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        header h1 {
            font-family: 'Fredoka One', cursive;
            color: white;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .home-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(238, 90, 90, 0.4);
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(238, 90, 90, 0.5);
        }

        /* TTS Toggle Butonu */
        .tts-toggle {
            background: linear-gradient(135deg, #00b894, #00a085);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tts-toggle:hover {
            transform: translateY(-2px);
        }

        .tts-toggle.off {
            background: linear-gradient(135deg, #636e72, #535c68);
            box-shadow: 0 4px 15px rgba(99, 110, 114, 0.4);
        }

        .tts-toggle .icon {
            font-size: 1.2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- Ayar Ekranı --- */
        .config-screen {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 650px;
            margin: 40px auto;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .config-screen h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            color: #5f27cd;
            margin-bottom: 30px;
        }

        .option-group {
            margin-bottom: 30px;
        }

        .option-group h3 {
            font-size: 1.3rem;
            color: #666;
            margin-bottom: 15px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .opt-btn {
            padding: 15px 25px;
            border: 3px solid #e0e0e0;
            background: white;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .opt-btn:hover {
            border-color: #a29bfe;
            transform: translateY(-2px);
        }

        .opt-btn.selected {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .start-btn {
            background: linear-gradient(135deg, #00b894, #00a085);
            color: white;
            padding: 20px 60px;
            border: none;
            border-radius: 50px;
            font-size: 1.8rem;
            font-weight: 900;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4);
            transition: all 0.3s ease;
            font-family: 'Fredoka One', cursive;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0, 184, 148, 0.5);
        }

        /* --- Oyun Alanı --- */
        .game-area {
            display: none;
            flex-direction: column;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .hud {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            border-radius: 50px;
            margin-bottom: 25px;
            font-size: 1.4rem;
            font-weight: 700;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 35px;
            color: #5f27cd;
        }

        .hud span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cards-grid {
            display: grid;
            gap: 12px;
            perspective: 1500px;
            justify-content: center;
            max-width: 100%;
            padding: 10px;
        }

        /* --- 3D Kart Tasarımı (YÜKSEK KONTRAST) --- */
        .memory-card {
            width: 110px;
            height: 110px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border-radius: 16px;
        }

            height: 160px;
        }

        .memory-card.flipped {
            transform: rotateY(180deg);
        }

        .memory-card.matched {
            animation: matchPulse 0.6s ease;
        }

        .memory-card.matched .back-face {
            background: linear-gradient(145deg, #d4edda, #b8e6c1);
            border-color: #28a745;
            box-shadow: 0 0 35px rgba(40, 167, 69, 0.6);
        }

        .memory-card.matched::after {
            content: '✓';
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 1.8rem;
            z-index: 100;
            color: #28a745;
            font-weight: bold;
        }

        .memory-card.wrong {
            animation: wrongShake 0.5s ease;
        }

        .memory-card.wrong .back-face {
            background: linear-gradient(145deg, #f8d7da, #f5c6cb);
            border-color: #dc3545;
            box-shadow: 0 0 30px rgba(220, 53, 69, 0.6);
        }

        @keyframes matchPulse {
            0% {
                transform: rotateY(180deg) scale(1);
            }

            50% {
                transform: rotateY(180deg) scale(1.15);
            }

            100% {
                transform: rotateY(180deg) scale(1);
            }
        }

        @keyframes wrongShake {

            0%,
            100% {
                transform: rotateY(180deg) translateX(0);
            }

            20% {
                transform: rotateY(180deg) translateX(-10px) rotate(-3deg);
            }

            40% {
                transform: rotateY(180deg) translateX(10px) rotate(3deg);
            }

            60% {
                transform: rotateY(180deg) translateX(-8px) rotate(-2deg);
            }

            80% {
                transform: rotateY(180deg) translateX(8px) rotate(2deg);
            }
        }

        .front-face,
        .back-face {
            width: 100%;
            height: 100%;
            position: absolute;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            top: 0;
            left: 0;
        }

        /* KART ARKASI - BEYAZ (Yüksek Kontrast!) */
        .front-face {
            background: linear-gradient(145deg, #ffffff, #f1f2f6);
            color: #5f27cd;
            font-size: 4rem;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.25),
                0 4px 15px rgba(0, 0, 0, 0.1),
                inset 0 2px 0 rgba(255, 255, 255, 1);
            border: 4px solid rgba(95, 39, 205, 0.3);
        }

        .front-face::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            background: repeating-linear-gradient(45deg,
                    rgba(95, 39, 205, 0.03) 0px,
                    rgba(95, 39, 205, 0.03) 3px,
                    transparent 3px,
                    transparent 12px);
        }

        /* KART ÖN YÜZ - AÇILINCA */
        .back-face {
            background: linear-gradient(145deg, #ffffff, #f8f9fa);
            transform: rotateY(180deg);
            border: 4px solid #e0e0e0;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.2),
                0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .back-face .emoji {
            font-size: 5.5rem;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
            line-height: 1;
        }

        /* --- Modal --- */
        #win-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(145deg, #ffffff, #f8f9fa);
            padding: 50px 60px;
            border-radius: 30px;
            text-align: center;
            animation: modalPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 90%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
        }

        @keyframes modalPop {
            from {
                transform: scale(0.5) rotateX(-15deg);
                opacity: 0;
            }

            to {
                transform: scale(1) rotateX(0);
                opacity: 1;
            }
        }

        .stars {
            font-size: 4rem;
            margin: 15px 0;
            animation: starBounce 1s ease infinite;
        }

        @keyframes starBounce {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .win-title {
            font-size: 3rem;
            color: #00b894;
            margin: 0;
            font-family: 'Fredoka One', cursive;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
        }

        .modal-stats {

        .replay-btn {

        // ============================================
        // SES SİSTEMİ (AudioContext API - Harici Dosya Yok!)
        // ============================================
        let audioContext = null;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // Kart Çevirme Sesi (Hafif Click)
        function playFlipSound() {
            if (!audioContext) return;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();

            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.frequency.setValueAtTime(800, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.08);
            osc.type = 'sine';

            gain.gain.setValueAtTime(0.15, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.08);

            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.08);
        }

        // Doğru Eşleşme Sesi (Neşeli Ding - Major Akor)
        function playMatchSound() {
            if (!audioContext) return;
            const notes = [523.25, 659.25, 783.99]; // C5, E5, G5 (Major akor)

            notes.forEach((freq, i) => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();

                osc.connect(gain);
                gain.connect(audioContext.destination);

                osc.frequency.setValueAtTime(freq, audioContext.currentTime);
                osc.type = 'sine';

                const startTime = audioContext.currentTime + (i * 0.08);
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.2, startTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.4);

                osc.start(startTime);
                osc.stop(startTime + 0.4);
            });
        }

            if (!audioContext) return;

            osc.connect(gain);

            osc.frequency.setValueAtTime(150, audioContext.currentTime);
            osc.type = 'sawtooth';

            gain.gain.setValueAtTime(0.15, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.25);

            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.25);
        }

        // Kazanma Sesi (Fanfar)
        function playWinSound() {
            if (!audioContext) return;
            const melody = [523.25, 587.33, 659.25, 783.99, 880, 1046.50];

            melody.forEach((freq, i) => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();

                osc.connect(gain);
                gain.connect(audioContext.destination);

                osc.frequency.setValueAtTime(freq, audioContext.currentTime);
                osc.type = 'triangle';

                const startTime = audioContext.currentTime + (i * 0.12);
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.25, startTime + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.5);

                osc.start(startTime);
                osc.stop(startTime + 0.5);

        // ============================================
        // KONUŞMA SİSTEMİ (TTS - Kontrollü)
        // ============================================
        let _ttsVoice = null;
        let _ttsVoicesLoaded = false;
        function _loadTTSVoice() {
            const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
            if (voices.length === 0) return;
            const trVoices = voices.filter(v => v.lang === 'tr-TR' || v.lang.startsWith('tr'));
            const googleVoice = trVoices.find(v => v.name.includes('Google'));
            _ttsVoice = googleVoice || trVoices[0] || null;
            _ttsVoicesLoaded = true;
            if (_ttsVoice) console.log('🗣️ Voice:', _ttsVoice.name);
        }

        const AI_AUDIO_BASE = 'assets/audio/gor-ve-sec';
        let _ttsAudioPlayer = null;
        const _failedWordAudio = new Set();

        function normalizeAudioKey(str) {
            return String(str || '')
                .replace(/I/g, 'ı')
                .replace(/İ/g, 'i')
                .toLowerCase()
                .replace(/ç/g, 'c')
                .replace(/ğ/g, 'g')
                .replace(/ı/g, 'i')
                .replace(/ö/g, 'o')
                .replace(/ş/g, 's')
                .replace(/ü/g, 'u')
                .replace(/[^a-z0-9]/g, '');
        }

        function stopChildFriendlyAudio() {
            if (!_ttsAudioPlayer) return;
            _ttsAudioPlayer.pause();
            _ttsAudioPlayer.currentTime = 0;
            _ttsAudioPlayer = null;
        }

        function speakFallbackTTS(text) {
            if (!window.speechSynthesis) return;
            stopChildFriendlyAudio();
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function speakWithChildFriendlyVoice(text) {
            const key = normalizeAudioKey(text);
            if (!key || _failedWordAudio.has(key)) {
                speakFallbackTTS(text);
                return;
            }

            stopChildFriendlyAudio();
            if (window.speechSynthesis) window.speechSynthesis.cancel();

            const audio = new Audio(`${AI_AUDIO_BASE}/${key}.mp3`);
            _ttsAudioPlayer = audio;
            let handled = false;

            const fallbackToTTS = () => {
                if (handled) return;
                handled = true;
                _failedWordAudio.add(key);
                if (_ttsAudioPlayer === audio) _ttsAudioPlayer = null;
                speakFallbackTTS(text);
            };

            audio.addEventListener('ended', () => {
                if (_ttsAudioPlayer === audio) _ttsAudioPlayer = null;
            }, { once: true });
            audio.addEventListener('error', fallbackToTTS, { once: true });
            audio.play().catch(fallbackToTTS);
        }

        // DOM Elementleri
        const grid = document.getElementById('grid');
        const moveDisplay = document.getElementById('moves');
        const timerDisplay = document.getElementById('timer');
        const configScreen = document.getElementById('config-screen');
        const gameArea = document.getElementById('game-area');
        const winModal = document.getElementById('win-modal');
        const startBtn = document.getElementById('start-btn');
        const replayBtn = document.getElementById('replay-btn');

        // ============================================
        // BUTON OLAY DİNLEYİCİLERİ
        // ============================================
        document.querySelectorAll('#cat-btns .opt-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('#cat-btns .opt-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                selectedCat = this.dataset.cat;
            });
        });

        document.querySelectorAll('#size-btns .opt-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('#size-btns .opt-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                selectedSize = parseInt(this.dataset.size);
            });
        });

        startBtn.addEventListener('click', startGame);
        replayBtn.addEventListener('click', () => location.reload());

        // ============================================
        // BENZERSİZ RASTGELE SEÇİM (Unique Random)
        // ============================================
        function getUniqueRandomItems(array, count) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled.slice(0, count);
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // ============================================
        // OYUN BAŞLATMA
        // ============================================
        function startGame() {
            initAudio();

            configScreen.style.display = 'none';
            gameArea.style.display = 'flex';

            matchedPairs = 0;
            moves = 0;
            time = 0;
            moveDisplay.textContent = '0';
            timerDisplay.textContent = '0:00';

            // Eski boyut sınıflarını temizle
            grid.className = 'cards-grid';

            // Boyut sınıfını ekle
            grid.classList.add(`size-${selectedSize}`);

            // Sütun sayısını belirle
            let cols = 4;
            if (selectedSize === 12) cols = 4;
            else if (selectedSize === 16) cols = 4;
            else if (selectedSize === 20) cols = 5;
            else if (selectedSize === 24) cols = 6;
            else if (selectedSize === 28) cols = 7;
            else if (selectedSize === 32) cols = 8;
            else if (selectedSize === 36) cols = 6;
            else if (selectedSize === 40) cols = 8;
            else if (selectedSize === 44) cols = 11;
            else if (selectedSize === 48) cols = 8;
            else if (selectedSize === 52) cols = 13;
            else if (selectedSize === 56) cols = 8;
            else if (selectedSize === 60) cols = 10;
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            // === BENZERSİZ ÇİFT SEÇİMİ ===
            const items = categories[selectedCat];
            const pairsNeeded = selectedSize / 2;

            const uniqueItems = getUniqueRandomItems(items, pairsNeeded);

            let deck = [];
            uniqueItems.forEach(item => {
                deck.push({ ...item, id: Math.random() });
                deck.push({ ...item, id: Math.random() });
            });

            deck = shuffleArray(deck);

            grid.innerHTML = '';
            deck.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('memory-card');
                card.dataset.name = item.name;

                // Ön Yüz (Kapalı - BEYAZ)
                const frontFace = document.createElement('div');
                frontFace.classList.add('front-face');
                frontFace.innerHTML = '❓';

                // Arka Yüz (BÜYÜK Emoji)
                const backFace = document.createElement('div');
                backFace.classList.add('back-face');
                backFace.innerHTML = `<span class="emoji">${item.emoji}</span>`;

                card.appendChild(frontFace);
                card.appendChild(backFace);

                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });

            startTimer();
        }

        // ============================================
        // KART ÇEVİRME
        // ============================================
        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;
            if (this.classList.contains('matched')) return;

            this.classList.add('flipped');
            playFlipSound();

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            moves++;
            moveDisplay.textContent = moves;
            checkForMatch();
        }

        // ============================================
        // EŞLEŞME KONTROLÜ
        // ============================================
        function checkForMatch() {
            const isMatch = firstCard.dataset.name === secondCard.dataset.name;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            lockBoard = true;

            setTimeout(() => {
                playMatchSound();

                firstCard.classList.add('matched');
                secondCard.classList.add('matched');

                // İsmi seslendir (TTS - sadece aktifse)
                speakName(firstCard.dataset.name);

                matchedPairs++;
                if (matchedPairs === selectedSize / 2) {
                    endGame();
                }

                resetBoard();
            }, 400);
        }

        function unflipCards() {
            lockBoard = true;

            // Hemen yanlış efekti göster
            setTimeout(() => {
                playErrorSound();
                firstCard.classList.add('wrong');
                secondCard.classList.add('wrong');
            }, 300);

            // 1.5 SANİYE BEKLE - Çocuk kartların yerini ezberlesin!
            setTimeout(() => {
                firstCard.classList.remove('flipped', 'wrong');
                secondCard.classList.remove('flipped', 'wrong');
                resetBoard();
            }, 300 + WRONG_CARD_DISPLAY_TIME); // 300ms (efekt) + 1500ms (bekleme)
        }

        function resetBoard() {
            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;
        }

        // ============================================
        // ZAMANLAYICI
        // ============================================
        function startTimer() {
            timerInterval = setInterval(() => {
                time++;
                const m = Math.floor(time / 60);
                const s = time % 60;
                timerDisplay.textContent = `${m}:${s < 10 ? '0' + s : s}`;
            }, 1000);
        }

        // ============================================
        // OYUN SONU
        // ============================================
        function endGame() {
            clearInterval(timerInterval);

            setTimeout(() => {
                playWinSound();

                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 200,
                        spread: 100,
                        origin: { y: 0.6 },
                        colors: ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#ff9ff3']
                    });

                    setTimeout(() => {
                        confetti({
                            particleCount: 100,
                            spread: 80,
                            origin: { x: 0.2, y: 0.5 }
                        });
                        confetti({
                            particleCount: 100,
                            spread: 80,
                            origin: { x: 0.8, y: 0.5 }
                        });
                    }, 300);
                }

                document.getElementById('final-time').textContent = timerDisplay.textContent;
                document.getElementById('final-moves').textContent = moves;

                let stars = '⭐';
                const optimalMoves = selectedSize;
                if (moves <= optimalMoves) {
                    stars = '⭐⭐⭐';
                } else if (moves <= optimalMoves * 1.5) {
                    stars = '⭐⭐';
                }
                document.getElementById('stars').textContent = stars;

                winModal.style.display = 'flex';

                // Tebrik mesajı (TTS aktifse)
                setTimeout(() => {
                    speakName('Tebrikler! Hepsini buldun!');
                }, 500);

            }, 600);
        }
    </script>
<script>
(function(){
  document.addEventListener("contextmenu", function(e){ e.preventDefault(); }, { capture: true });
})();
</script>
