<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anlam Köprüsü</title>
  <style>
    :root{
      --bg1:#f4f9ff;--bg2:#fdfbf7;--ink:#1f3553;--muted:#637896;--blue:#4c93f7;--orange:#f7b052;--ok:#31a85c;--bad:#e85b66;
      --s1:0 18px 42px rgba(28,53,87,.15);--s2:0 10px 22px rgba(28,53,87,.12);--r1:30px;--r2:22px;--r3:16px;
    }
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}
    body{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));overflow-x:hidden}
    button{font:inherit;color:inherit}
    .app{width:min(calc(100% - 20px),1300px);margin:14px auto 18px}
    .hidden{display:none!important}
    .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    .start{min-height:min(78vh,620px);display:grid;place-items:center;padding:18px}
    .start-card{width:min(100%,860px);background:rgba(255,255,255,.95);border-radius:30px;box-shadow:var(--s1);padding:22px}
    .start-card h1{margin:0 0 14px;text-align:center;font-size:clamp(1.8rem,3.2vw,2.6rem)}
    .start-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .mode-btn{min-height:180px;border:0;border-radius:24px;padding:16px;text-align:left;cursor:pointer;box-shadow:var(--s2);transition:.15s}
    .mode-btn strong{display:block;font-size:1.95rem;line-height:1;margin-bottom:8px}
    .mode-btn span{display:block;font-size:1.14rem;line-height:1.38;color:var(--muted);font-weight:700}
    .mode-btn.ant{background:linear-gradient(145deg,#edf5ff,#fff)}
    .mode-btn.syn{background:linear-gradient(145deg,#fff6e7,#fff)}
    .mode-btn:hover,.mode-btn:focus-visible{transform:translateY(-2px)}

    .game{background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.8);border-radius:34px;box-shadow:var(--s1);padding:14px}
    .top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:2px 2px 10px}
    .top h2{margin:0;font-size:clamp(2rem,4vw,3rem);line-height:1.03}
    .tip{margin:8px 0 0;color:var(--muted);font-size:clamp(1rem,1.5vw,1.16rem);font-weight:700}
    .mode-pill{min-height:50px;padding:0 15px;border-radius:999px;background:#fff;box-shadow:var(--s2);display:inline-flex;align-items:center;gap:10px;font-weight:900}
    .dot{width:15px;height:15px;border-radius:99px;background:linear-gradient(145deg,var(--blue),#87c1ff);box-shadow:0 0 0 7px rgba(76,147,247,.15)}

    .board{position:relative;min-height:clamp(420px,63vh,730px);border-radius:var(--r1);padding:12px;
      background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(248,252,255,.95));box-shadow:inset 0 1px 0 rgba(255,255,255,.8),var(--s2);overflow:hidden}
    .grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,5vw,80px);min-height:clamp(390px,57vh,690px)}
    .line,.fx{position:absolute;inset:0;width:100%;height:100%}.line{z-index:4;pointer-events:none}.fx{z-index:5;pointer-events:none;overflow:hidden}
    .col{display:grid;gap:12px;align-content:space-evenly}
    
    .card{min-height:clamp(88px,11vh,110px);border-radius:var(--r2);background:#fff;box-shadow:var(--s2);border:4px solid transparent;display:grid;align-items:center;transition:.2s;animation:in .33s both; cursor:pointer;}
    .card.left{grid-template-columns:1fr auto;padding:10px 10px 10px 16px}
    .card.right{grid-template-columns:auto 1fr;padding:10px 16px 10px 10px}
    .card.active{border-color:rgba(76,147,247,.5);box-shadow:0 15px 30px rgba(76,147,247,.2); transform:scale(1.02)}
    .card.selected{border-color:var(--blue);box-shadow:0 0 0 4px rgba(76,147,247,.2); transform:scale(1.02)}
    .card.target{transform:scale(1.014);box-shadow:0 16px 32px rgba(247,176,82,.2)}
    .card.guide{border-color:rgba(49,168,92,.4);box-shadow:0 16px 32px rgba(49,168,92,.14)}
    .card.ok{border-color:rgba(49,168,92,.5);background:linear-gradient(180deg,#fff,#f3fff5); cursor:default; pointer-events:none;}
    .card.bad{border-color:rgba(232,91,102,.6);animation:shake .34s}
    .word{display:flex;align-items:center;gap:9px;min-width:0; pointer-events:none;}
    .label{font-size:clamp(1.4rem,2vw,1.9rem);font-weight:900;line-height:1.03;word-break:break-word}
    .chip{min-width:34px;height:34px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.88rem;font-weight:900}
    .chip.ok{background:var(--ok)}.chip.bad{background:var(--bad)}
    
    .pin{position:relative;width:clamp(62px,7vw,76px);height:clamp(62px,7vw,76px);border:0;border-radius:99px;background:#fff;box-shadow:0 13px 24px rgba(22,45,78,.16);cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;transition:.15s; pointer-events:none;}
    .pin:before,.pin:after{content:"";position:absolute;border-radius:99px}.pin:before{inset:8px}.pin:after{inset:17px}
    .pin.left:before{background:linear-gradient(145deg,#d8e8ff,#a9cdff)} .pin.left:after{background:linear-gradient(145deg,var(--blue),#7bbdff);box-shadow:0 0 0 7px rgba(76,147,247,.18)}
    .pin.right:before{background:linear-gradient(145deg,#ffe9c7,#ffd89c)} .pin.right:after{background:linear-gradient(145deg,var(--orange),#ffce7d);box-shadow:0 0 0 7px rgba(247,176,82,.18)}
    .pin.hot{transform:scale(1.08)} .pin.guide:before{animation:pulse .72s infinite}
    .board.drag .pin.right:not(:disabled){box-shadow:0 12px 24px rgba(247,176,82,.22)}
    .pin:disabled{opacity:.72;cursor:default}

    .foot{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:12px 2px 2px}
    .b{min-height:62px;border:0;border-radius:var(--r3);font-size:1.02rem;font-weight:900;cursor:pointer;box-shadow:var(--s2);transition:.14s}
    .b.p{background:linear-gradient(145deg,var(--blue),#79bcff);color:#fff}
    .b.s{background:#fff;color:#25456f}.b.w{background:linear-gradient(145deg,#fff7ea,#fff);color:#25456f}
    .b:hover,.b:focus-visible{transform:translateY(-2px)}

    .toast,.win{position:fixed;left:50%;opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px);transition:.15s}
    .toast{top:16px;z-index:20;min-height:48px;padding:0 15px;border-radius:999px;background:rgba(28,52,86,.94);color:#fff;font-size:.96rem;font-weight:900;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--s2)}
    .win{top:50%;z-index:24;width:min(calc(100% - 26px),334px);border-radius:24px;background:rgba(255,255,255,.98);box-shadow:var(--s1);padding:16px;text-align:center}
    .toast.show,.win.show{opacity:1;transform:translateX(-50%) translateY(0)} .win.show{pointer-events:auto}
    .win h3{margin:0 0 8px;font-size:1.95rem}.win p{margin:0;color:var(--muted);font-size:1rem;line-height:1.4;font-weight:700}
    .mini{margin:11px auto 0;min-height:38px;padding:0 13px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:#e6f7ec;color:var(--ok);font-weight:900}
    .winb{margin-top:10px;min-height:46px;border:0;border-radius:14px;padding:0 16px;background:linear-gradient(145deg,var(--blue),#77b9ff);color:#fff;font-size:.98rem;font-weight:900;cursor:pointer}
    .spark{position:absolute;width:11px;height:11px;border-radius:3px;opacity:0;animation:sp .68s ease-out forwards}
    .conf{position:absolute;top:-24px;width:10px;height:18px;border-radius:5px;opacity:0;animation:cf 1.1s ease-out forwards}

    @keyframes in{from{opacity:0;transform:translateY(9px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-7px)}60%{transform:translateX(7px)}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(49,168,92,.24)}50%{box-shadow:0 0 0 13px rgba(49,168,92,.03)}}
    @keyframes sp{0%{opacity:1;transform:scale(.3) translate3d(0,0,0)}100%{opacity:0;transform:scale(1) translate3d(var(--dx),var(--dy),0) rotate(var(--rt))}}
    @keyframes cf{0%{opacity:1;transform:translate3d(0,0,0) rotate(0deg)}100%{opacity:1;transform:translate3d(var(--d),90vh,0) rotate(var(--r))}}
    @media (max-width:980px){.top{grid-template-columns:1fr}.foot{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media (max-width:760px){
      .app{width:min(calc(100% - 12px),1300px)} .start-grid{grid-template-columns:1fr}
      .mode-btn{min-height:150px}.mode-btn strong{font-size:1.7rem}.game{border-radius:24px;padding:10px}
      .board{padding:9px}.grid{gap:10px}.card.left{padding:9px 9px 9px 11px}.card.right{padding:9px 11px 9px 9px}
      .label{font-size:clamp(1.08rem,4.8vw,1.35rem)} .pin{width:55px;height:55px}.pin:before{inset:7px}.pin:after{inset:14px}
      .foot{grid-template-columns:repeat(2,minmax(0,1fr))}
      .foot #fsBtn { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="start" id="startScreen">
      <div class="start-card">
        <h1>Modunu Seç ve Başla</h1>
        <div class="start-grid">
          <button class="mode-btn ant" id="startAntonyms" type="button" aria-label="Zıt anlamlı modunda başla">
            <strong>Zıt Anlamlı</strong>
            <span>Büyük-küçük, sıcak-soğuk gibi ters anlamları eşleştir.</span>
          </button>
          <button class="mode-btn syn" id="startSynonyms" type="button" aria-label="Eş anlamlı modunda başla">
            <strong>Eş Anlamlı</strong>
            <span>Cevap-yanıt, hızlı-çabuk gibi yakın anlamları eşleştir.</span>
          </button>
        </div>
      </div>
    </section>

    <section class="game hidden" id="gameShell">
      <header class="top">
        <div>
          <h2>Anlam Köprüsü</h2>
          <p class="tip" id="instructionText">Kelimeleri eşleştirmek için kutulara dokun veya sürükle.</p>
        </div>
        <div class="mode-pill"><span class="dot" aria-hidden="true"></span><span id="modeLabel">Zıt Anlamlı</span></div>
      </header>

      <section class="board" id="board">
        <svg class="line" id="lineLayer" aria-hidden="true"></svg>
        <div class="fx" id="fxLayer" aria-hidden="true"></div>
        <div class="grid">
          <div class="col" id="leftColumn"></div>
          <div class="col" id="rightColumn"></div>
        </div>
      </section>

      <footer class="foot">
        <button class="b p" id="newGameBtn" type="button">Yeni Oyun</button>
        <button class="b s" id="resetBtn" type="button">Sıfırla</button>
        <button class="b w" id="modeBtn" type="button">Mod Değiştir</button>
        <button class="b w" id="soundBtn" type="button">Ses Açık</button>
        <button class="b w" id="fsBtn" type="button">Tam Ekran</button>
      </footer>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <div class="win" id="finishPop" aria-live="polite">
    <h3 id="finishTitle">Harika!</h3>
    <p id="finishText">Tüm eşleşmeleri tamamladın.</p>
    <div class="mini" id="finishMini">Yeni tur hazır</div>
    <button class="winb" id="finishActionBtn" type="button">Yeni Tur</button>
  </div>
  <div class="sr" id="liveRegion" aria-live="polite"></div>

  <script>
    const MODES={
      antonyms:{label:"Zıt Anlamlı",pairs:[
        ["büyük","küçük"],["uzun","kısa"],["sıcak","soğuk"],["hızlı","yavaş"],["açık","kapalı"],["temiz","kirli"],["yeni","eski"],["gece","gündüz"],["doğru","yanlış"],["dolu","boş"],
        ["sert","yumuşak"],["ince","kalın"],["mutlu","üzgün"],["kolay","zor"],["erken","geç"],["üst","alt"],["iç","dış"],["yakın","uzak"],["az","çok"],["ağır","hafif"],
        ["genç","yaşlı"],["geniş","dar"],["ıslak","kuru"],["sessiz","gürültülü"],["ileri","geri"],["düz","eğri"],["giriş","çıkış"],["başlangıç","bitiş"],["sık","seyrek"],["tok","aç"],
        ["zengin","yoksul"],["canlı","cansız"]
      ]},
      synonyms:{label:"Eş Anlamlı",pairs:[
        ["cevap","yanıt"],["siyah","kara"],["kalp","yürek"],["öykü","hikaye"],["konuk","misafir"],["hızlı","çabuk"],["neden","sebep"],["ilave","ek"],["doktor","hekim"],["görev","iş"],
        ["yıl","sene"],["beyaz","ak"],["öğrenci","talebe"],["şehir","kent"],["araç","taşıt"],["yaşam","hayat"],["kelime","sözcük"],["güzel","hoş"],["akıllı","zeki"],["küçük","minik"],
        ["büyük","kocaman"],["yardım","destek"],["ev","konut"],["okul","mektep"],["anı","hatıra"],["ödül","armağan"],["baş","kafa"],["yurt","vatan"],["sınav","imtihan"],["uyarı","ikaz"],
        ["özgür","serbest"],["düş","rüya"]
      ]}
    };
    const SUCCESS=["Harika!","Süper!","Tebrikler!"];
    const state={mode:"antonyms",started:false,pairs:[],left:[],right:[],connections:[],mistakes:[],dragging:null,selectedLeftId:null,hoverRightId:null,guidedRightId:null,snap:null,flashes:{left:{},right:{}},complete:false,soundOn:true,modeDeck:{antonyms:[],synonyms:[]},recentPool:{antonyms:[],synonyms:[]},raf:0,timeouts:[]};
    const els={
      start:document.getElementById("startScreen"),startAnt:document.getElementById("startAntonyms"),startSyn:document.getElementById("startSynonyms"),
      game:document.getElementById("gameShell"),board:document.getElementById("board"),left:document.getElementById("leftColumn"),right:document.getElementById("rightColumn"),
      line:document.getElementById("lineLayer"),fx:document.getElementById("fxLayer"),modeLabel:document.getElementById("modeLabel"),tip:document.getElementById("instructionText"),
      newGame:document.getElementById("newGameBtn"),reset:document.getElementById("resetBtn"),modeBtn:document.getElementById("modeBtn"),sound:document.getElementById("soundBtn"),fsBtn:document.getElementById("fsBtn"),
      toast:document.getElementById("toast"),win:document.getElementById("finishPop"),winTitle:document.getElementById("finishTitle"),winText:document.getElementById("finishText"),winMini:document.getElementById("finishMini"),winBtn:document.getElementById("finishActionBtn"),live:document.getElementById("liveRegion")
    };
    const map=new Map(); let audioCtx=null;
    const green=()=>getComputedStyle(document.documentElement).getPropertyValue("--ok").trim()||"#31a85c";
    const red=()=>getComputedStyle(document.documentElement).getPropertyValue("--bad").trim()||"#e85b66";

    const shuffle=(arr)=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    const byId=(id)=>state.pairs.find(p=>p.id===id);
    const leftConn=(id)=>state.connections.find(c=>c.leftId===id)||null;
    const rightUsed=(id)=>state.connections.some(c=>c.rightId===id);
    const clearTimers=()=>{state.timeouts.forEach(clearTimeout);state.timeouts=[]};
    const announce=(t)=>{els.live.textContent="";setTimeout(()=>{els.live.textContent=t},10)};
    function toast(t,d=950){els.toast.textContent=t;els.toast.classList.add("show");clearTimeout(els.toast._t);els.toast._t=setTimeout(()=>els.toast.classList.remove("show"),d)}
    function updateShell(){els.start.classList.toggle("hidden",state.started);els.game.classList.toggle("hidden",!state.started);els.modeLabel.textContent=MODES[state.mode].label;}
    function clearWin(){els.win.classList.remove("show")}

    function refillModeDeck(mode){
      const source=MODES[mode].pairs.map((pair,index)=>({poolId:`${mode}-${index}`,left:pair[0],right:pair[1]}));
      state.modeDeck[mode].push(...shuffle(source));
    }
    function resetModeCycle(mode){
      state.modeDeck[mode]=[];
      state.recentPool[mode]=[];
    }
    function makeRound(){
      const mode=state.mode,size=4+Math.floor(Math.random()*2),picked=[],recent=state.recentPool[mode],usedLeft=new Set();
      let guard=0;
      while(picked.length<size && guard<900){
        if(state.modeDeck[mode].length===0)refillModeDeck(mode);
        const cand=state.modeDeck[mode].shift();
        if(!cand)break;
        const need=size-picked.length;
        const leftKey=cand.left.toLocaleLowerCase("tr-TR");
        const skipRecent=recent.includes(cand.poolId) && state.modeDeck[mode].length>=need;
        const skipDuplicate=usedLeft.has(leftKey) && state.modeDeck[mode].length>=need;
        if(skipRecent || skipDuplicate){state.modeDeck[mode].push(cand);guard++;continue}
        usedLeft.add(leftKey);
        picked.push(cand);guard++;
      }
      while(picked.length<size){
        if(state.modeDeck[mode].length===0)refillModeDeck(mode);
        const cand=state.modeDeck[mode].shift();
        if(!cand)break;
        const leftKey=cand.left.toLocaleLowerCase("tr-TR");
        if(usedLeft.has(leftKey) && state.modeDeck[mode].length>0){
          state.modeDeck[mode].push(cand);
          continue;
        }
        usedLeft.add(leftKey);
        picked.push(cand);
      }
      const keepRecent=Math.min(12,Math.max(2,MODES[mode].pairs.length-1));
      state.recentPool[mode]=[...state.recentPool[mode],...picked.map(p=>p.poolId)].slice(-keepRecent);
      state.pairs=picked.map((p,i)=>({id:`${mode}-${Date.now()}-${i}-${Math.random().toString(36).slice(2,6)}`,left:p.left,right:p.right,attempts:0}));
      state.left=shuffle(state.pairs.map(p=>p.id));state.right=shuffle(state.pairs.map(p=>p.id));
    }

    function card(side,id,i){
      const p=byId(id),ok=side==="left"?!!leftConn(id):rightUsed(id),a=!!(state.dragging&&side==="left"&&state.dragging.leftId===id),sel=(side==="left"&&state.selectedLeftId===id),t=side==="right"&&state.hoverRightId===id,g=side==="right"&&state.guidedRightId===id;
      const bad=state.mistakes.some(l=>l.leftId===id||l.rightId===id)||state.flashes[side][id]==="bad";
      const c=["card",side,ok?"ok":"",a?"active":"",sel?"selected":"",t?"target":"",g?"guide":"",bad?"bad":""].filter(Boolean).join(" ");
      const chip=ok?'<span class="chip ok" aria-hidden="true">OK</span>':(state.flashes[side][id]==="bad"?'<span class="chip bad" aria-hidden="true">X</span>':"");
      const pin=["pin",side,t?"hot":"",g?"guide":""].filter(Boolean).join(" ");
      if(side==="left")return `<article class="${c}" data-side="${side}" data-id="${id}" style="--index:${i}"><div class="word">${chip}<div class="label">${p.left}</div></div><button class="${pin}" type="button" data-left="${id}" data-pin="left:${id}" aria-label="${p.left} kelimesini bağla" ${ok?"disabled":""}></button></article>`;
      return `<article class="${c}" data-side="${side}" data-id="${id}" style="--index:${i}"><button class="${pin}" type="button" data-right="${id}" data-pin="right:${id}" aria-label="${p.right} kelimesini hedefle" ${ok?"disabled":""}></button><div class="word">${chip}<div class="label">${p.right}</div></div></article>`;
    }

    function renderBoard(){
      els.left.innerHTML=state.left.map((id,i)=>card("left",id,i)).join("");
      els.right.innerHTML=state.right.map((id,i)=>card("right",id,i)).join("");
      refreshPins();
      
      // Tıkla-Eşleştir & Sürükle Eventleri
      els.left.querySelectorAll(".card.left").forEach(n=>{
        n.addEventListener("pointerdown",(e)=>{
           if(!leftConn(n.dataset.id)) startDrag(n.dataset.id,e);
        });
        n.addEventListener("click",()=>{
           if(!leftConn(n.dataset.id)) { state.selectedLeftId = n.dataset.id; refreshClasses(); }
        });
      });
      
      els.right.querySelectorAll(".card.right").forEach(n=>{
        n.addEventListener("click",()=>{
           if(state.selectedLeftId && !rightUsed(n.dataset.id)) {
              connect(state.selectedLeftId, n.dataset.id);
              state.selectedLeftId = null;
              refreshClasses();
           }
        });
      });
      
      refreshClasses(); drawSoon();
    }

    function refreshPins(){map.clear();document.querySelectorAll("[data-pin]").forEach(n=>map.set(n.dataset.pin,n))}
    function pinPoint(side,id){const n=map.get(`${side}:${id}`);if(!n)return null;const r=n.getBoundingClientRect(),b=els.board.getBoundingClientRect();return{x:r.left-b.left+r.width/2,y:r.top-b.top+r.height/2}}
    function bez(a,b){const c=Math.max(86,Math.abs(b.x-a.x)*.42);return`M ${a.x} ${a.y} C ${a.x+c} ${a.y}, ${b.x-c} ${b.y}, ${b.x} ${b.y}`}
    function badge(x,y,txt,col){return`<g><circle cx="${x}" cy="${y}" r="16" fill="${col}" stroke="#fff" stroke-width="4"></circle><text x="${x}" y="${y+6}" fill="#fff" font-size="16" font-weight="900" text-anchor="middle">${txt}</text></g>`}

    function draw(){
      const out=[];
      state.connections.forEach(l=>{const a=pinPoint("left",l.leftId),b=pinPoint("right",l.rightId);if(!a||!b)return;out.push(`<path d="${bez(a,b)}" fill="none" stroke="${green()}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></path>`);out.push(badge((a.x+b.x)/2,(a.y+b.y)/2,"OK",green()))});
      state.mistakes.forEach(l=>{const a=pinPoint("left",l.leftId),b=pinPoint("right",l.rightId);if(!a||!b)return;out.push(`<g tabindex="0" role="button" aria-label="Yanlış çizgiyi sil" data-m="${l.id}" style="pointer-events:auto;cursor:pointer"><path d="${bez(a,b)}" fill="none" stroke="transparent" stroke-width="28" stroke-linecap="round"></path><path d="${bez(a,b)}" fill="none" stroke="${red()}" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 12"></path>${badge((a.x+b.x)/2,(a.y+b.y)/2,"X",red())}</g>`)});
      if(state.dragging){const br=els.board.getBoundingClientRect(),a={x:state.dragging.startX,y:state.dragging.startY},p={x:state.dragging.currentX-br.left,y:state.dragging.currentY-br.top},b=state.snap||p,col=state.guidedRightId?"#45b56a":"#4c93f7";out.push(`<path d="${bez(a,b)}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="13 10"></path>`)}
      els.line.innerHTML=out.join("");
      els.line.querySelectorAll("[data-m]").forEach(n=>{const rm=()=>removeMistake(n.dataset.m);n.addEventListener("click",rm);n.addEventListener("keydown",(e)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();rm()}})});
    }
    function drawSoon(){if(state.raf)cancelAnimationFrame(state.raf);state.raf=requestAnimationFrame(()=>{state.raf=0;refreshPins();draw()})}

    function nearestRight(x,y){
      let best=null;map.forEach((n,k)=>{if(!k.startsWith("right:"))return;const id=k.slice(6);if(rightUsed(id))return;const r=n.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,d=Math.hypot(cx-x,cy-y);if(!best||d<best.d)best={id,d,cx,cy}});
      return best;
    }
    function clearHints(){state.hoverRightId=null;state.guidedRightId=null;state.snap=null}
    function updateHover(x,y){
      if(!state.dragging)return;const n=nearestRight(x,y);
      state.hoverRightId=n&&n.d<=170?n.id:null;state.guidedRightId=n&&n.d<=130&&n.id===state.dragging.leftId?n.id:null;
      if(n&&n.d<=95){const b=els.board.getBoundingClientRect();state.snap={x:n.cx-b.left,y:n.cy-b.top}}else state.snap=null;
    }
    function startDrag(leftId,e){
      if(state.complete||leftConn(leftId))return;
      const p=pinPoint("left",leftId);if(!p)return;
      state.dragging={pointerId:e.pointerId,leftId,startX:p.x,startY:p.y,currentX:e.clientX,currentY:e.clientY};els.board.classList.add("drag");
      state.selectedLeftId = leftId;
      if(e.currentTarget.setPointerCapture){try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){ }}
      updateHover(e.clientX,e.clientY);refreshClasses();drawSoon();
    }
    function onMove(e){if(!state.dragging||e.pointerId!==state.dragging.pointerId)return;state.dragging.currentX=e.clientX;state.dragging.currentY=e.clientY;updateHover(e.clientX,e.clientY);refreshClasses();drawSoon()}
    function resolveDrop(x,y){
      const d=document.elementFromPoint(x,y),t=d&&d.closest(".card.right");if(t&&!rightUsed(t.dataset.id))return t.dataset.id;
      const n=nearestRight(x,y);return n&&n.d<=142?n.id:null;
    }
    function stopDrag(){state.dragging=null;clearHints();els.board.classList.remove("drag");refreshClasses();drawSoon()}
    function onUp(e){if(!state.dragging||e.pointerId!==state.dragging.pointerId)return;const d={...state.dragging},rightId=resolveDrop(e.clientX,e.clientY);stopDrag();if(rightId){connect(d.leftId,rightId); state.selectedLeftId=null;} refreshClasses();}
    function onCancel(e){if(!state.dragging||e.pointerId!==state.dragging.pointerId)return;stopDrag()}

    function tone(f,t,d,g,tp){if(!state.soundOn)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audioCtx)audioCtx=new C();if(audioCtx.state==="suspended")audioCtx.resume();const o=audioCtx.createOscillator(),a=audioCtx.createGain();o.type=tp||"sine";o.frequency.setValueAtTime(f,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(t,audioCtx.currentTime+d);a.gain.setValueAtTime(g,audioCtx.currentTime);a.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(a);a.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}
    const soundOk=()=>{tone(560,880,.14,.13,"sine");setTimeout(()=>tone(770,1050,.12,.1,"triangle"),55)};
    const soundBad=()=>tone(220,160,.16,.11,"triangle");
    const soundWin=()=>[0,70,130].forEach((ms,i)=>setTimeout(()=>tone(500+i*120,660+i*160,.17,.1,"sine"),ms));

    function flash(side,id,t,d){state.flashes[side][id]=t;renderBoard();const tm=setTimeout(()=>{delete state.flashes[side][id];renderBoard()},d);state.timeouts.push(tm)}
    function sparks(side,id){const p=pinPoint(side,id);if(!p)return;const cols=["#ffd35f","#73d7a5","#78b8ff","#ffc17d"];for(let i=0;i<6;i++){const s=document.createElement("span");s.className="spark";s.style.left=p.x+"px";s.style.top=p.y+"px";s.style.background=cols[i%cols.length];s.style.setProperty("--dx",((Math.random()*76)-38)+"px");s.style.setProperty("--dy",((Math.random()*76)-38)+"px");s.style.setProperty("--rt",((Math.random()*360)-180)+"deg");els.fx.appendChild(s);setTimeout(()=>s.remove(),700)}}
    function confetti(){const cols=["#4c93f7","#f7b052","#31a85c","#e85b66"];for(let i=0;i<18;i++){const c=document.createElement("span");c.className="conf";c.style.left=(6+Math.random()*88)+"%";c.style.background=cols[i%cols.length];c.style.setProperty("--d",((Math.random()*140)-70)+"px");c.style.setProperty("--r",((Math.random()*760)-380)+"deg");els.fx.appendChild(c);setTimeout(()=>c.remove(),1120)}}

    function removeMistake(id){const n=state.mistakes.filter(m=>m.id!==id);if(n.length===state.mistakes.length)return;state.mistakes=n;renderBoard()}
    function refreshClasses(){
      document.querySelectorAll("[data-side]").forEach(c=>{const side=c.dataset.side,id=c.dataset.id,a=!!(state.dragging&&side==="left"&&state.dragging.leftId===id),sel=(side==="left"&&state.selectedLeftId===id),t=side==="right"&&state.hoverRightId===id,g=side==="right"&&state.guidedRightId===id;c.classList.toggle("active",a);c.classList.toggle("selected",sel);c.classList.toggle("target",t);c.classList.toggle("guide",g)});
      document.querySelectorAll(".pin[data-right]").forEach(p=>{const id=p.dataset.right;p.classList.toggle("hot",state.hoverRightId===id);p.classList.toggle("guide",state.guidedRightId===id)});
    }

    function winRound(){state.complete=true;const w=SUCCESS[Math.floor(Math.random()*SUCCESS.length)];els.winTitle.textContent=w;els.winText.textContent="Tüm eşleşmeleri tamamladın. Hazırsan yeni tura geç.";els.winMini.textContent=state.pairs.length+" eşleşme bitti";els.winBtn.textContent="Yeni Tur";els.win.classList.add("show");soundWin();confetti();toast(w,1000);announce(w)}
    function connect(leftId,rightId){
      if(state.complete||leftConn(leftId)||rightUsed(rightId))return;const p=byId(leftId);p.attempts+=1;
      if(leftId===rightId){state.connections.push({leftId,rightId});soundOk();sparks("right",rightId);flash("left",leftId,"ok",250);flash("right",rightId,"ok",250);renderBoard();toast("Doğru eşleşme",820);announce("Doğru eşleşme");if(state.connections.length===state.pairs.length)winRound();return}
      const id="w-"+Math.random().toString(36).slice(2,7);state.mistakes.push({id,leftId,rightId});soundBad();flash("left",leftId,"bad",300);flash("right",rightId,"bad",300);renderBoard();toast("Tekrar dene",760);announce("Yanlış eşleşme");const tm=setTimeout(()=>removeMistake(id),850);state.timeouts.push(tm);
    }

    function buildRound(){if(!state.started)return;clearTimers();state.complete=false;state.connections=[];state.mistakes=[];state.dragging=null;state.selectedLeftId=null;clearHints();state.flashes={left:{},right:{}};clearWin();makeRound();updateShell();renderBoard();drawSoon()}
    function resetRound(){if(!state.started)return;clearTimers();state.complete=false;state.connections=[];state.mistakes=[];state.dragging=null;state.selectedLeftId=null;clearHints();state.flashes={left:{},right:{}};clearWin();renderBoard();drawSoon();toast("Tur sıfırlandı",820);announce("Tur sıfırlandı")}
    function switchMode(){state.mode=state.mode==="antonyms"?"synonyms":"antonyms";if(!state.started){updateShell();return}buildRound();toast(MODES[state.mode].label+" modu",880);announce(MODES[state.mode].label+" modu açıldı")}
    function startGame(mode,silent){state.mode=mode;state.started=true;resetModeCycle(mode);updateShell();buildRound();if(!silent){toast(MODES[state.mode].label+" başladı",880);announce(MODES[state.mode].label+" başladı")}}
    function toggleSound(){state.soundOn=!state.soundOn;els.sound.textContent=state.soundOn?"Ses Açık":"Ses Kapalı";toast(state.soundOn?"Ses açıldı":"Ses kapatıldı",900)}
    
    els.fsBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(()=>{}); els.fsBtn.textContent="Küçült"; } 
      else { document.exitFullscreen(); els.fsBtn.textContent="Tam Ekran"; }
    });

    function applyQuery(){const q=new URLSearchParams(window.location.search),m=q.get("mode"),a=q.get("autostart");if(m&&MODES[m])state.mode=m;if(a==="1"){startGame(state.mode,true);return}updateShell()}
    els.newGame.addEventListener("click",buildRound);els.reset.addEventListener("click",resetRound);els.modeBtn.addEventListener("click",switchMode);els.sound.addEventListener("click",toggleSound);
    els.winBtn.addEventListener("click",buildRound);els.startAnt.addEventListener("click",()=>startGame("antonyms",false));els.startSyn.addEventListener("click",()=>startGame("synonyms",false));
    window.addEventListener("pointermove",onMove,{passive:false});window.addEventListener("pointerup",onUp,{passive:false});window.addEventListener("pointercancel",onCancel,{passive:false});window.addEventListener("resize",drawSoon);window.addEventListener("scroll",drawSoon,true);
    applyQuery();
  </script>
</body>
</html>
