<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritmik Sayma</title>
</head>
<body>
    <h1>Ritmik Sayma</h1>
    <div id="level-display">Gezegen: 1/20</div>
    <script>
        const totalLevels = 20;
        let currentLevel = 1;

        function nextLevel() {
            if (currentLevel < totalLevels) {
                currentLevel++;
                updateDisplay();
            } else {
                alert('All levels completed!');
            }
        }

        function updateDisplay() {
            document.getElementById('level-display').innerText = 'Gezegen: ' + currentLevel + '/' + totalLevels;
        }

        // Simulate level progression for demonstration
        setInterval(nextLevel, 2000);
    </script>
</body>
</html>
