<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ritmik Uzay Yolu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        :root {
            --warp-speed: 1;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #0f172a;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
        }

        /* Yıldızlar - Warp hızı değişkenine bağlı */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle calc(var(--duration) / var(--warp-speed)) infinite ease-in-out;
            opacity: var(--opacity);
            transition: transform 0.5s; 
        }

        /* Warp efekti sırasında yıldızlar uzar */
        .warping .star {
            height: 2px !important;
            width: 50px !important;
            opacity: 0.8;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: translateX(0); }
            50% { opacity: 1; }
            100% { opacity: 0.2; transform: translateX(-100px); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .game-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .game-btn:active {
            transform: scale(0.95);
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Karakter Seçimi Stilleri */
        .char-select.selected {
            background-color: rgba(251, 191, 36, 0.4);
            border-color: #fcd34d;
            transform: scale(1.1);
        }

        /* Seri (Streak) Animasyonu */
        .streak-pop {
            animation: streakAnim 0.8s ease-out forwards;
        }

        @keyframes streakAnim {
            0% { opacity: 0; transform: scale(0.5) rotate(-10deg); }
            20% { opacity: 1; transform: scale(1.5) rotate(10deg); }
            80% { opacity: 1; transform: scale(1) rotate(0deg); }
            100% { opacity: 0; transform: scale(1.5) translateY(-50px); }
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
        
        /* AI Loading Animation */
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
            background-color: #fbbf24; 
            border-radius: 50%;
            display: inline-block;
            height: 6px;
            margin-right: 3px;
            width: 6px;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center text-white relative overflow-hidden">

    <!-- Arkaplan Yıldızları -->
    <div id="stars-container" class="absolute inset-0 z-0 transition-all duration-1000"></div>
    <canvas id="confetti-canvas"></canvas>

    <!-- ANA MENÜ -->
    <div id="menu-screen" class="z-10 w-full max-w-5xl p-4 flex flex-col items-center justify-center h-full overflow-y-auto">
        <h1 class="text-4xl md:text-6xl font-bold mb-4 text-center text-yellow-400 drop-shadow-lg floating">
            🚀 Ritmik Uzay Yolu
        </h1>

        <!-- KARAKTER SEÇİMİ -->
        <div class="glass-panel p-4 rounded-2xl mb-6 w-full max-w-2xl">
            <h3 class="text-xl text-center text-blue-200 mb-3">Pilotunu Seç:</h3>
            <div class="flex justify-center gap-4 md:gap-8">
                <button onclick="selectChar('👨‍🚀')" class="char-select selected w-20 h-20 text-4xl bg-white/5 rounded-full border-2 border-transparent transition-all hover:scale-105">👨‍🚀</button>
                <button onclick="selectChar('👩‍🚀')" class="char-select w-20 h-20 text-4xl bg-white/5 rounded-full border-2 border-transparent transition-all hover:scale-105">👩‍🚀</button>
                <button onclick="selectChar('👽')" class="char-select w-20 h-20 text-4xl bg-white/5 rounded-full border-2 border-transparent transition-all hover:scale-105">👽</button>
                <button onclick="selectChar('🤖')" class="char-select w-20 h-20 text-4xl bg-white/5 rounded-full border-2 border-transparent transition-all hover:scale-105">🤖</button>
                <button onclick="selectChar('🐱‍🚀')" class="char-select w-20 h-20 text-4xl bg-white/5 rounded-full border-2 border-transparent transition-all hover:scale-105">🐱‍🚀</button>
            </div>
        </div>

        <p class="text-xl mb-4 text-blue-200 text-center">Hangi sayılarla oynamak istersin?</p>
        
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 w-full">
            <!-- Butonlar JS ile oluşturulacak -->
        </div>
    </div>

    <!-- OYUN EKRANI -->
    <div id="game-screen" class="hidden z-10 w-full max-w-4xl p-4 flex-col items-center h-full justify-between py-4 relative">
        
        <!-- SERİ SAYACI (Animasyonlu Popup) -->
        <div id="streak-container" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none z-50"></div>

        <!-- Üst Bilgi -->
        <div class="w-full flex justify-between items-center glass-panel p-3 rounded-2xl mb-2 relative">
            <button onclick="goToMenu()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-xl shadow-lg active:scale-95 transition text-sm md:text-base z-20">
                ← Çıkış
            </button>
            
            <!-- Seçilen Karakter Avatarı -->
            <div class="absolute left-1/2 transform -translate-x-1/2 -top-6 md:-top-8">
                <div class="w-16 h-16 md:w-20 md:h-20 bg-indigo-600 rounded-full border-4 border-yellow-400 flex items-center justify-center text-4xl md:text-5xl shadow-xl floating" id="current-pilot">
                    👨‍🚀
                </div>
            </div>

            <div class="flex gap-4">
                <div class="text-xl md:text-2xl font-bold text-yellow-300 flex flex-col items-end">
                    <span>Puan</span>
                    <span id="score" class="text-white">0</span>
                </div>
            </div>
        </div>

        <!-- Hedef Göstergesi -->
        <div class="w-full flex justify-center mb-2">
             <div class="text-lg font-bold text-blue-200 bg-blue-900/50 px-4 py-1 rounded-full">
                Gezegen: <span id="target-counter">1/20</span>
            </div>
        </div>

        <!-- ✨ GEMINI AI GÖREV METNİ -->
        <div id="mission-panel" class="w-full glass-panel bg-indigo-900/40 p-3 rounded-2xl mb-4 text-center min-h-[60px] flex items-center justify-center border-yellow-400/30">
            <div id="mission-text" class="text-yellow-100 text-lg md:text-xl font-medium italic">
                <!-- AI Metni buraya gelecek -->
            </div>
        </div>

        <!-- Soru Alanı (Tren Vagonları) -->
        <div class="flex-1 flex flex-col items-center justify-center w-full">
            <div id="sequence-container" class="flex flex-wrap items-center justify-center gap-2 md:gap-4 mb-6 md:mb-8">
                <!-- Sayı kutuları buraya gelecek -->
            </div>

            <div class="text-2xl mb-4 md:mb-6 text-purple-200 font-semibold animate-pulse bg-purple-900/50 px-6 py-2 rounded-full border border-purple-500/30">
                Sıradaki sayı hangisi?
            </div>

            <!-- Cevap Seçenekleri -->
            <div id="options-container" class="grid grid-cols-3 gap-3 md:gap-8 w-full max-w-2xl">
                <!-- Seçenekler buraya gelecek -->
            </div>
        </div>
        
        <!-- İlerleme Çubuğu -->
        <div class="w-full bg-gray-700 rounded-full h-3 md:h-4 mt-2 glass-panel border-none">
            <div id="progress-bar" class="bg-gradient-to-r from-green-400 to-blue-500 h-3 md:h-4 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
    </div>

    <!-- BİTİŞ EKRANI -->
    <div id="end-screen" class="hidden z-20 absolute inset-0 bg-black/80 flex flex-col items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-panel p-6 md:p-8 rounded-3xl text-center max-w-lg w-full pop-in border-yellow-400/30 relative overflow-hidden">
            <div class="text-6xl mb-4" id="end-pilot-display">👨‍🚀</div>
            <h2 class="text-3xl md:text-4xl font-bold text-yellow-400 mb-2">Harika İş Pilot!</h2>
            <p class="text-xl text-white mb-4">Uzay yolculuğunu tamamladın!</p>
            
            <!-- ✨ GEMINI AI ÖDÜL METNİ -->
            <div class="bg-white/10 rounded-xl p-4 mb-6 border border-white/20">
                <div class="text-xs text-yellow-300 font-bold mb-1 uppercase tracking-wider">✨ Uzaydan Gelen Mesaj</div>
                <div id="ai-reward-text" class="text-white text-lg font-medium italic min-h-[50px] flex items-center justify-center">
                </div>
            </div>

            <div class="text-3xl font-bold text-green-400 mb-6">
                Toplam Puan: <span id="final-score">0</span>
            </div>
            <button onclick="goToMenu()" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white text-2xl font-bold py-3 md:py-4 px-8 rounded-2xl shadow-xl transform transition hover:scale-105">
                Tekrar Oyna 🔄
            </button>
        </div>
    </div>
    
    <script>
      // Full original script content would go here...
    </script>
</body>
</html>
